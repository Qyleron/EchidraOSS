<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sessions - EchidraOSS | Qyleron</title>
  <link rel="icon" href="/assets/qyleron_logo.png" type="image/png" />
  <style>
    :root { color-scheme: dark; --bg: #000000; --surface: #0a0a0a; --surface-strong: #111111; --text: #ffffff; --muted: #999999; --line: #1f1f1f; --accent: #ffffff; --shadow: none; font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--bg); color: var(--text); }
    body::before { content: ""; position: fixed; inset: 0; z-index: -1; opacity: 0.02; background-image: linear-gradient(90deg, #333 1px, transparent 1px), linear-gradient(#333 1px, transparent 1px); background-size: 50px 50px; }
    .topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid var(--line); background: var(--surface); }
    .brand-banner { display: block; width: clamp(112px, 16vw, 170px); height: 42px; object-fit: contain; object-position: left center; }
    .product-name { color: var(--muted); font-size: 15px; font-weight: 650; white-space: nowrap; }
    .navbar { position: fixed; top: 64px; left: 0; right: 0; z-index: 999; height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 24px; border-bottom: 1px solid var(--line); background: var(--surface); }
    .nav-links, .navbar-actions { display: flex; align-items: center; gap: 4px; }
    .navbar-actions { gap: 10px; margin-left: auto; }
    .nav-link { display: inline-block; padding: 6px 14px; border-radius: 8px; color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 650; }
    .nav-link.active { color: var(--text); background: var(--surface-strong); }
    .logout-button { min-height: 34px; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; color: var(--muted); background: transparent; cursor: pointer; font: inherit; font-size: 13px; }
    .content { min-height: calc(100vh - 116px); margin-top: 116px; padding: 20px 24px 40px; }
    .inner { width: min(1400px, 100%); margin: 0 auto; display: grid; gap: 18px; }
    .panel { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
    .panel-header { padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .panel-title { margin: 0; font-size: 15px; font-weight: 750; }
    .panel-body { padding: 16px; color: var(--muted); }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td { padding: 11px 12px; border-bottom: 1px solid var(--line); text-align: left; font-size: 13px; }
    th { color: var(--muted); background: var(--surface-strong); }
    @media (max-width: 768px) { .topbar, .navbar { padding-inline: 16px; } .nav-links { overflow-x: auto; } .navbar-actions { margin-left: 0; } .content { padding-inline: 16px; } }
  </style>
</head>
<body>
  <header class="topbar">
    <img class="brand-banner" src="/assets/Qyleron_Banner.png" alt="Qyleron" />
    <div class="product-name">EchidraOSS</div>
  </header>
  <nav class="navbar" aria-label="Primary dashboard navigation">
    <div class="nav-links">
      <a class="nav-link" href="/dashboard">Overview</a>
      <a class="nav-link active" href="/dashboard/sessions">Sessions</a>
      <a class="nav-link" href="/dashboard/intelligence">Intelligence</a>
      <a class="nav-link" href="/dashboard/personas">Personas</a>
      <a class="nav-link" href="/dashboard/alerts">Alerts</a>
      <a class="nav-link" href="/dashboard/reports">Reports</a>
    </div>
    <div class="navbar-actions">
      <button id="logoutButton" class="logout-button" type="button">Logout</button>
    </div>
  </nav>
  <main class="content">
    <div class="inner">
      <section class="panel">
        <div class="panel-header"><h1 class="panel-title">Sessions</h1></div>
        <div class="panel-body">
          <table>
            <thead><tr><th>Session</th><th>Actor</th><th>Risk</th><th>Status</th></tr></thead>
            <tbody><tr><td colspan="4">Session exploration view is ready for the next data pass.</td></tr></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
  <script>
    document.getElementById("logoutButton").addEventListener("click", async () => {
      await fetch("/auth/logout", { method: "POST" });
      window.location.assign("/auth");
    });
  </script>
</body>
</html>
