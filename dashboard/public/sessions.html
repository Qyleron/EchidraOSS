<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sessions - Echidra OSS | Qyleron</title>
  <link rel="icon" href="/assets/qyleron_logo.png" type="image/png" />
  <link rel="stylesheet" href="/dashboard.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-row1">
        <a href="/" class="logo" aria-label="Qyleron home">
          <img src="/assets/Qyleron_Banner.png" alt="Qyleron" />
        </a>
        <div class="product-name">Echidra OSS</div>
      </div>
      <nav class="navbar" aria-label="Primary dashboard navigation">
        <div class="nav-links">
          <a class="nav-link" href="/dashboard">Overview</a>
          <a class="nav-link active" href="/dashboard/sessions">Sessions</a>
          <a class="nav-link" href="/dashboard/analytics">Analytics</a>
          <a class="nav-link" href="/dashboard/intelligence">Intelligence</a>
          <a class="nav-link" href="/dashboard/personas">Personas</a>
          <a class="nav-link" href="/dashboard/alerts">Alerts</a>
        </div>
        <button id="logoutButton" class="logout-button" type="button">Logout</button>
      </nav>
    </header>

    <main class="dashboard-main">
      <section class="page-panel" aria-labelledby="sessionsTitle">
        <div class="page-panel-header">
          <div class="page-panel-title">
            <h1 id="sessionsTitle">Captured Attacker Sessions</h1>
          </div>
          <div class="page-panel-actions">
            <div class="time-range-control">
              <button id="timeRangeButton" class="text-button" type="button">Loading range...</button>
              <div id="timeRangePanel" class="time-range-panel">
                <div class="time-range-row">
                  <div class="time-range-group">
                    <label for="rangeFromDate">From date</label>
                    <input type="date" id="rangeFromDate" />
                  </div>
                  <div class="time-range-group">
                    <label for="rangeFromHour">From hour</label>
                    <select id="rangeFromHour"></select>
                  </div>
                </div>
                <div class="time-range-row">
                  <div class="time-range-group">
                    <label for="rangeToDate">To date</label>
                    <input type="date" id="rangeToDate" />
                  </div>
                  <div class="time-range-group">
                    <label for="rangeToHour">To hour</label>
                    <select id="rangeToHour"></select>
                  </div>
                </div>
                <div class="time-range-actions">
                  <button id="applyRangeButton" class="text-button" type="button">Apply</button>
                </div>
              </div>
            </div>
            <button id="downloadVisibleButton" class="text-button" type="button">Export CSV</button>
          </div>
        </div>

        <div class="table-shell">
          <table class="data-table" aria-describedby="sessionsTitle">
            <thead>
              <tr>
                <th>Time</th>
                <th>Source IP</th>
                <th>Country</th>
                <th>Persona</th>
                <th>Protocol</th>
                <th>Actor</th>
                <th>Risk</th>
                <th>Intent</th>
              </tr>
            </thead>
            <tbody id="sessionsTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script>
    let allSessions = [];
    let visibleSessions = [];
    let sessionsLoadFailed = false;
    const eventsCache = new Map();
    const tableBody = document.getElementById("sessionsTableBody");

    const ACTOR_LABELS = {
      automated_scanner: "Automated Scanner",
      brute_force_bot: "Brute-Force Bot",
      commodity_bot: "Commodity Bot",
      script_kiddie: "Script Kiddie",
      skilled_human_operator: "Skilled Human Operator"
    };

    const PROTOCOL_LABELS = {
      tcp_shell: "SSH",
      http: "HTTP",
      ftp: "FTP",
      telnet: "TELNET"
    };

    const INTENT_LABELS = {
      unknown: "Unknown",
      reconnaissance: "Reconnaissance",
      credential_theft: "Credential Access",
      data_access: "Data Access",
      interactive_operation: "Interactive Operation"
    };

    const ANALYST_RECOMMENDATION_TEXT = {
      increase_source_monitoring: "Increase monitoring on this source — discovery activity may precede credential access or exploitation.",
      preserve_session_transcript: "Preserve this session transcript for analyst review and replay.",
      review_decoy_exposure: "Review which decoy files were surfaced and whether they need rotation.",
      rotate_exposed_credentials: "Rotate any credentials this session may have captured or exposed.",
      escalate_incident_review: "Escalate this session for incident review before any external action."
    };

    function escHtml(str) {
      return String(str == null ? "" : str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    const PERSONA_LABEL_OVERRIDES = {
      ubuntu_web_server: "Ubuntu Web Server",
      debian_mail_gateway: "Debian Mail Gateway",
      centos_database: "CentOS Database",
      generic_linux: "Generic Linux Shell"
    };

    function personaDisplay(personaId) {
      if (!personaId) return "Unknown persona";
      return PERSONA_LABEL_OVERRIDES[personaId] || personaId
        .split(/[_-]/)
        .map((word) => word.charAt(0).toUpperCase() + word.slice(1))
        .join(" ");
    }

    function badgeTier(riskLevel) {
      if (riskLevel === "critical" || riskLevel === "high") return "high";
      if (riskLevel === "medium") return "medium";
      return "low";
    }

    function formatDuration(startedAt, endedAt) {
      const totalSeconds = Math.max(0, Math.round((endedAt ?? startedAt) - startedAt));
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return minutes > 0 ? `${minutes}m ${String(seconds).padStart(2, "0")}s` : `${seconds}s`;
    }

    function formatSessionTime(date) {
      const day = String(date.getDate()).padStart(2, "0");
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const year = String(date.getFullYear()).slice(-2);
      const hour24 = date.getHours();
      const period = hour24 < 12 ? "AM" : "PM";
      const hour12 = String(hour24 % 12 === 0 ? 12 : hour24 % 12).padStart(2, "0");
      const minutes = String(date.getMinutes()).padStart(2, "0");
      return `${day}/${month}/${year} ${hour12}:${minutes} ${period}`;
    }

    function localDateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    async function fetchJSON(url) {
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`Request failed for ${url} (${response.status})`);
      }
      return response.json();
    }

    function mapRun(run) {
      return {
        id: run.id,
        sessionId: run.session_id,
        timestamp: new Date(run.started_at * 1000),
        endedAt: run.ended_at,
        startedAt: run.started_at,
        sourceIp: run.peer_ip || "unknown",
        country: run.country || "Unknown",
        persona: personaDisplay(run.persona_id),
        protocol: PROTOCOL_LABELS[run.protocol] || (run.protocol ? run.protocol.toUpperCase() : "Unknown"),
        actor: run.actor_label,
        risk: run.risk_level,
        intent: INTENT_LABELS[run.intent] || run.intent,
        duration: formatDuration(run.started_at, run.ended_at),
        evidence: (run.signals || [])
          .filter((signal) => signal.signal_type === "evidence")
          .map((signal) => signal.signal_value)
          .join(" "),
        analystRecommendationAction: (
          (run.signals || []).find((signal) => signal.signal_type === "analyst_recommendation") || {}
        ).signal_key
      };
    }

    function renderSessions(sessionsToRender) {
      if (sessionsToRender.length === 0) {
        const message = sessionsLoadFailed
          ? "Could not load sessions. Is the database configured?"
          : "No sessions in this range.";
        tableBody.innerHTML = `<tr><td colspan="8" class="empty-state" style="text-align: center;">${message}</td></tr>`;
        return;
      }
      tableBody.innerHTML = sessionsToRender.map((session) => `
        <tr data-session-row="${session.id}" tabindex="0" aria-expanded="false">
          <td>
            <div class="cell-primary">
              <strong>${formatSessionTime(session.timestamp)}</strong>
              <span>${session.duration}</span>
            </div>
          </td>
          <td class="mono-cell">${escHtml(session.sourceIp)}</td>
          <td>${escHtml(session.country)}</td>
          <td>
            <div class="cell-primary">
              <strong>${escHtml(session.persona)}</strong>
              <span>${escHtml(session.sessionId)}</span>
            </div>
          </td>
          <td>${escHtml(session.protocol)}</td>
          <td>
            <span class="actor-badge ${session.actor === "skilled_human_operator" ? "human" : "bot"}">
              ${escHtml(session.actor ? (ACTOR_LABELS[session.actor] || session.actor) : "Unclassified")}
            </span>
          </td>
          <td><span class="risk-badge ${badgeTier(session.risk)}">${escHtml(session.risk)}</span></td>
          <td>${escHtml(session.intent)}</td>
        </tr>
      `).join("");
    }

    async function loadSessionEvents(sessionId) {
      if (eventsCache.has(sessionId)) {
        return eventsCache.get(sessionId);
      }
      try {
        const events = await fetchJSON(`/sessions/${sessionId}/events`);
        eventsCache.set(sessionId, events);
        return events;
      } catch (error) {
        console.error(error);
        return [];
      }
    }

    async function toggleSession(sessionId) {
      const row = document.querySelector(`[data-session-row="${sessionId}"]`);
      const existingDetail = document.getElementById(`${sessionId}-detail`);
      document.querySelectorAll(".session-detail-row").forEach((detail) => detail.remove());
      document.querySelectorAll("[data-session-row]").forEach((sessionRow) => {
        sessionRow.classList.remove("selected");
        sessionRow.setAttribute("aria-expanded", "false");
      });

      if (existingDetail) {
        return;
      }

      const session = allSessions.find((item) => item.id === sessionId);
      row.classList.add("selected");
      row.setAttribute("aria-expanded", "true");
      row.insertAdjacentHTML("afterend", `
        <tr id="${session.id}-detail" class="session-detail-row">
          <td colspan="8">
            <div class="session-detail">
              <section class="detail-block" aria-label="Session evidence">
                <h3>Evidence</h3>
                <p>${escHtml(session.evidence || "No rule evidence recorded for this session.")}</p>
              </section>
              <section class="detail-block" aria-label="Command timeline">
                <h3>Command Timeline</h3>
                <ul class="command-list" id="${session.id}-commands">
                  <li>Loading…</li>
                </ul>
              </section>
              <section class="detail-block" aria-label="Analyst recommendation">
                <h3>Analyst Recommendation</h3>
                <p>${escHtml(
                  ANALYST_RECOMMENDATION_TEXT[session.analystRecommendationAction] ||
                  "Review the evidence and preserve the session transcript."
                )}</p>
              </section>
            </div>
          </td>
        </tr>
      `);

      const events = await loadSessionEvents(session.sessionId);
      const commandList = document.getElementById(`${session.id}-commands`);
      if (!commandList) return; // row was collapsed again before the fetch resolved
      const commands = events.filter((event) => event.event_type === "command");
      commandList.innerHTML = commands.length
        ? commands.map((event) => `<li>${escHtml(event.event_value)}</li>`).join("")
        : `<li>No commands were captured in this session.</li>`;
    }

    // Neutralizes CSV/formula injection: a cell starting with =, +, -, @ (or
    // tab/CR) is interpreted as a live formula by Excel/Sheets/LibreOffice
    // when the exported file is opened. Session fields here are attacker-
    // influenced (peer IP, persona/actor labels), so every exported cell is
    // sanitized here rather than trusting individual call sites to do it.
    function sanitizeCsvCell(value) {
      const stringValue = String(value == null ? "" : value);
      return /^[=+\-@\t\r]/.test(stringValue) ? `'${stringValue}` : stringValue;
    }

    function downloadCsv(filename, rows) {
      const csv = rows.map((row) => row.map((value) => `"${sanitizeCsvCell(value).replaceAll('"', '""')}"`).join(",")).join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    tableBody.addEventListener("click", (event) => {
      const row = event.target.closest("[data-session-row]");
      if (row) {
        toggleSession(row.dataset.sessionRow);
      }
    });

    tableBody.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") {
        return;
      }
      const row = event.target.closest("[data-session-row]");
      if (row) {
        event.preventDefault();
        toggleSession(row.dataset.sessionRow);
      }
    });

    document.getElementById("downloadVisibleButton").addEventListener("click", () => {
      const rows = [
        ["Time", "Source IP", "Country", "Persona", "Protocol", "Actor", "Risk", "Intent"],
        ...visibleSessions.map((session) => [
          formatSessionTime(session.timestamp),
          session.sourceIp,
          session.country,
          session.persona,
          session.protocol,
          session.actor ? (ACTOR_LABELS[session.actor] || session.actor) : "Unclassified",
          session.risk,
          session.intent
        ])
      ];
      downloadCsv("echidra-sessions-visible.csv", rows);
    });

    const HOUR_OPTIONS = Array.from({ length: 24 }, (_, hour) => {
      const period = hour < 12 ? "AM" : "PM";
      const displayHour = hour % 12 === 0 ? 12 : hour % 12;
      return { hour, label: `${displayHour} ${period}` };
    });

    function populateHourSelect(select, hours, selectedHour) {
      select.innerHTML = hours.map(({ hour, label }) => `<option value="${hour}">${label}</option>`).join("");
      select.value = String(selectedHour);
    }

    // Keeps the range picker from ever producing an inverted range: the
    // calendar can't pick a "to" date before "from" (native min/max), and
    // when both dates are the same day, each hour dropdown only offers
    // hours that keep the combined range valid.
    function syncRangeConstraints() {
      const fromDateInput = document.getElementById("rangeFromDate");
      const toDateInput = document.getElementById("rangeToDate");
      const fromHourSelect = document.getElementById("rangeFromHour");
      const toHourSelect = document.getElementById("rangeToHour");

      if (fromDateInput.value) toDateInput.min = fromDateInput.value;
      if (toDateInput.value) fromDateInput.max = toDateInput.value;
      if (fromDateInput.value && toDateInput.value && toDateInput.value < fromDateInput.value) {
        toDateInput.value = fromDateInput.value;
      }

      const sameDay = Boolean(fromDateInput.value) && fromDateInput.value === toDateInput.value;
      const currentFromHour = Number(fromHourSelect.value || 0);
      const currentToHour = Number(toHourSelect.value || 23);

      if (sameDay) {
        const upperBound = Math.max(currentFromHour, currentToHour);
        const lowerBound = Math.min(currentFromHour, currentToHour);
        populateHourSelect(fromHourSelect, HOUR_OPTIONS.filter(({ hour }) => hour <= upperBound), lowerBound);
        populateHourSelect(toHourSelect, HOUR_OPTIONS.filter(({ hour }) => hour >= lowerBound), upperBound);
      } else {
        populateHourSelect(fromHourSelect, HOUR_OPTIONS, currentFromHour);
        populateHourSelect(toHourSelect, HOUR_OPTIONS, currentToHour);
      }
    }

    function formatRangeLabel(from, to) {
      const fmt = (date) => date.toLocaleDateString("en-GB", { day: "2-digit", month: "short" });
      return `${fmt(from)} – ${fmt(to)}`;
    }

    function readRange() {
      const fromDate = document.getElementById("rangeFromDate").value;
      const fromHour = Number(document.getElementById("rangeFromHour").value);
      const toDate = document.getElementById("rangeToDate").value;
      const toHour = Number(document.getElementById("rangeToHour").value);

      const from = new Date(`${fromDate}T00:00:00`);
      from.setHours(fromHour, 0, 0, 0);

      const to = new Date(`${toDate}T00:00:00`);
      to.setHours(toHour, 59, 59, 999);

      return { from, to };
    }

    function applyRange() {
      const { from, to } = readRange();
      visibleSessions = allSessions.filter((session) => session.timestamp >= from && session.timestamp <= to);
      renderSessions(visibleSessions);
      document.getElementById("timeRangeButton").textContent = formatRangeLabel(from, to);
    }

    function initTimeRangeControl() {
      const fromDateInput = document.getElementById("rangeFromDate");
      const toDateInput = document.getElementById("rangeToDate");
      const fromHourSelect = document.getElementById("rangeFromHour");
      const toHourSelect = document.getElementById("rangeToHour");
      const timeRangeButton = document.getElementById("timeRangeButton");
      const timeRangePanel = document.getElementById("timeRangePanel");

      const now = new Date();
      populateHourSelect(fromHourSelect, HOUR_OPTIONS, 0);
      populateHourSelect(toHourSelect, HOUR_OPTIONS, 23);
      toDateInput.value = localDateKey(now);
      const defaultFrom = new Date(now);
      defaultFrom.setDate(defaultFrom.getDate() - 6);
      fromDateInput.value = localDateKey(defaultFrom);
      syncRangeConstraints();

      [fromDateInput, toDateInput, fromHourSelect, toHourSelect].forEach((input) => {
        input.addEventListener("change", syncRangeConstraints);
      });

      timeRangeButton.addEventListener("click", (event) => {
        event.stopPropagation();
        timeRangePanel.classList.toggle("open");
      });

      document.getElementById("applyRangeButton").addEventListener("click", () => {
        applyRange();
        timeRangePanel.classList.remove("open");
      });

      document.addEventListener("click", (event) => {
        if (!event.target.closest(".time-range-control")) {
          timeRangePanel.classList.remove("open");
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          timeRangePanel.classList.remove("open");
        }
      });

      applyRange();
    }

    async function logoutDashboard() {
      const logoutButton = document.getElementById("logoutButton");
      logoutButton.disabled = true;
      try {
        await fetch("/auth/logout", { method: "POST" });
      } finally {
        window.location.assign("/auth");
      }
    }

    async function loadSessions() {
      try {
        const runs = await fetchJSON("/classifier/runs?limit=500");
        allSessions = runs.map(mapRun);
      } catch (error) {
        console.error(error);
        allSessions = [];
        sessionsLoadFailed = true;
      }
      initTimeRangeControl();
    }

    document.getElementById("logoutButton").addEventListener("click", logoutDashboard);
    loadSessions();
  </script>
</body>
</html>
