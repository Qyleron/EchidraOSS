<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Intelligence - Echidra OSS | Qyleron</title>
  <link rel="icon" href="/assets/qyleron_logo.png" type="image/png" />
  <link rel="stylesheet" href="/dashboard.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-row1">
        <a href="/" class="logo" aria-label="Qyleron home">
          <img src="/assets/Qyleron_Banner.png" alt="Qyleron" />
        </a>
        <div class="product-name">Echidra OSS</div>
      </div>
      <nav class="navbar" aria-label="Primary dashboard navigation">
        <div class="nav-links">
          <a class="nav-link" href="/dashboard">Overview</a>
          <a class="nav-link active" href="/dashboard/intelligence">Intelligence</a>
          <a class="nav-link" href="/dashboard/sessions">Sessions</a>
          <a class="nav-link" href="/dashboard/analytics">Analytics</a>
          <a class="nav-link" href="/dashboard/personas">Personas</a>
          <a class="nav-link" href="/dashboard/alerts">Alerts</a>
        </div>
        <button id="logoutButton" class="logout-button" type="button">Logout</button>
      </nav>
    </header>

    <div id="logoutConfirmModal" class="modal-backdrop" hidden aria-modal="true" role="dialog" aria-labelledby="logoutConfirmTitle">
      <div class="modal" style="max-width:380px;">
        <div class="modal-header">
          <h2 id="logoutConfirmTitle">Log Out</h2>
          <button class="modal-close modal-close-danger" id="logoutConfirmCloseBtn" type="button" aria-label="Close">&times;</button>
        </div>
        <div class="modal-body" style="padding:22px;">
          <p style="margin:0 0 18px;color:var(--muted);">Are you sure you want to log out of Echidra?</p>
          <div style="display:flex;justify-content:flex-end;gap:8px;">
            <button type="button" class="text-button" id="logoutCancelBtn">Cancel</button>
            <button type="button" class="text-button" id="logoutConfirmBtn" style="border-color:rgba(255,92,112,0.3);color:#ff9aa6;">Log Out</button>
          </div>
        </div>
      </div>
    </div>

    <div id="issueInspectorBackdrop" class="session-inspector-backdrop" hidden></div>
    <aside id="issueInspector" class="session-inspector" hidden aria-modal="true" role="dialog" aria-labelledby="issueInspectorTitle">
      <div class="session-inspector-header">
        <h2 id="issueInspectorTitle">Issue Detail</h2>
        <button class="modal-close modal-close-danger" id="issueInspectorCloseBtn" type="button" aria-label="Close">&times;</button>
      </div>
      <div class="session-inspector-body" id="issueInspectorBody"></div>
    </aside>

    <main class="dashboard-main">
      <section class="page-panel" aria-labelledby="issuesTitle">
        <div class="page-panel-header">
          <div class="page-panel-title">
            <h1 id="issuesTitle" tabindex="-1">Issue Intelligence</h1>
          </div>
        </div>

        <div class="table-shell">
          <table class="data-table" aria-describedby="issuesTitle">
            <colgroup>
              <col style="width: 22%;" />
              <col style="width: 9%;" />
              <col style="width: 20%;" />
              <col style="width: 8%;" />
              <col style="width: 30%;" />
              <col style="width: 11%;" />
            </colgroup>
            <thead>
              <tr>
                <th>Event</th>
                <th>Severity</th>
                <th>MITRE Techniques</th>
                <th>Sessions</th>
                <th>Recommended Fix</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="issueTableBody"></tbody>
          </table>
        </div>
        <div id="issuesPagination" class="table-pagination"></div>
      </section>
    </main>
  </div>

  <script>
    const SEVERITY_LABELS = { high: "High", medium: "Medium", low: "Low" };
    let currentIssues = [];
    let currentIssuePage = 1;
    const ISSUES_PAGE_SIZE = 10;
    const issuesPaginationContainer = document.getElementById("issuesPagination");

    function escHtml(str) {
      return String(str == null ? "" : str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function escAttr(str) {
      return String(str == null ? "" : str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Evidence strings are always built server-side as "<summary sentence>."
    // optionally followed by " Matched: cmd1; cmd2; cmd3." (see
    // _build_evidence in issue_sync.py). Splitting on that fixed marker lets
    // the summary and the matched commands render as a labeled block instead
    // of one run-on paragraph, without needing a schema change to store them
    // as separate fields.
    function renderEvidence(evidence) {
      const marker = " Matched: ";
      const markerIndex = evidence.indexOf(marker);
      if (markerIndex === -1) {
        return `<p class="evidence-summary">${escHtml(evidence)}</p>`;
      }
      const summary = evidence.slice(0, markerIndex);
      const samples = evidence
        .slice(markerIndex + marker.length)
        .replace(/\.$/, "")
        .split("; ")
        .filter(Boolean);
      return `
        <p class="evidence-summary">${escHtml(summary)}</p>
        <span class="evidence-samples-label">Matched commands</span>
        <ul class="evidence-samples">
          ${samples.map((sample) => `<li>${escHtml(sample)}</li>`).join("")}
        </ul>
      `;
    }

    function statusLabel(status) {
      return status === "open" ? "Open" : "Closed";
    }

    async function fetchIssues() {
      const response = await fetch("/issues");
      if (!response.ok) {
        throw new Error(`Failed to load issues (${response.status})`);
      }
      return response.json();
    }

    function renderIssueRows(issues) {
      const tableBody = document.getElementById("issueTableBody");
      if (issues.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="6" class="empty-state" style="text-align: center;">No issues detected yet.</td></tr>`;
        renderIssuesPagination(1);
        return;
      }
      const totalPages = Math.max(1, Math.ceil(issues.length / ISSUES_PAGE_SIZE));
      currentIssuePage = Math.min(currentIssuePage, totalPages);
      const pageStart = (currentIssuePage - 1) * ISSUES_PAGE_SIZE;
      const pageItems = issues.slice(pageStart, pageStart + ISSUES_PAGE_SIZE);
      tableBody.innerHTML = pageItems.map((issue) => `
        <tr data-issue-row="${escAttr(issue.id)}" tabindex="0" aria-haspopup="dialog">
          <td><div class="cell-primary"><strong>${escHtml(issue.title)}</strong></div></td>
          <td><span class="risk-badge ${escAttr(issue.severity)}">${escHtml(SEVERITY_LABELS[issue.severity] ?? issue.severity ?? "Unknown")}</span></td>
          <td>
            <ul class="mitre-technique-list">
              ${(issue.mitre || []).map((technique) => `<li>${escHtml(technique.id)} - ${escHtml(technique.name)}</li>`).join("")}
            </ul>
          </td>
          <td>${
            issue.actor_label
              ? `<a href="/dashboard/sessions?actor=${encodeURIComponent(issue.actor_label)}" class="session-count-link" title="View this actor's sessions">${escHtml(issue.session_count)}</a>`
              : escHtml(issue.session_count)
          }</td>
          <td class="cell-truncate" title="${escAttr(issue.recommended_fix)}">${escHtml(issue.recommended_fix)}</td>
          <td>
            <button
              type="button"
              class="status-toggle ${escAttr(issue.status)}"
              data-issue-id="${escAttr(issue.id)}"
              aria-pressed="${issue.status === "closed"}"
            >${escHtml(statusLabel(issue.status))}</button>
          </td>
        </tr>
      `).join("");
      renderIssuesPagination(totalPages);
    }

    function renderIssuesPagination(totalPages) {
      const hadFocusInside = issuesPaginationContainer.contains(document.activeElement);
      if (totalPages <= 1) {
        issuesPaginationContainer.innerHTML = "";
        // The controls this click/focus was inside of no longer exist --
        // land on the page title instead of silently dropping to <body>.
        if (hadFocusInside) document.getElementById("issuesTitle").focus();
        return;
      }
      issuesPaginationContainer.innerHTML = `
        <button type="button" class="text-button" id="issuesPrevPage" ${currentIssuePage === 1 ? "disabled" : ""}>Prev</button>
        <span class="pagination-status" id="issuesPaginationStatus" tabindex="-1">Page ${currentIssuePage} of ${totalPages}</span>
        <button type="button" class="text-button" id="issuesNextPage" ${currentIssuePage === totalPages ? "disabled" : ""}>Next</button>
      `;
      document.getElementById("issuesPrevPage").addEventListener("click", () => {
        if (currentIssuePage > 1) {
          currentIssuePage -= 1;
          renderIssueRows(currentIssues);
        }
      });
      document.getElementById("issuesNextPage").addEventListener("click", () => {
        if (currentIssuePage < totalPages) {
          currentIssuePage += 1;
          renderIssueRows(currentIssues);
        }
      });
      if (hadFocusInside) {
        document.getElementById("issuesPaginationStatus").focus();
      }
    }

    // Slide-over panel for issue detail -- shares the same drawer component
    // (and CSS classes) as the Sessions page's Session Inspector, so the two
    // pages behave consistently instead of one expanding inline and the
    // other sliding over.
    const issueInspector = document.getElementById("issueInspector");
    const issueInspectorBackdrop = document.getElementById("issueInspectorBackdrop");
    const issueInspectorBody = document.getElementById("issueInspectorBody");
    let lastFocusedIssueTrigger = null;
    let issueHideTimeoutId = null;

    function getIssueInspectorFocusable() {
      return Array.from(
        issueInspector.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')
      ).filter((el) => !el.disabled);
    }

    function trapIssueInspectorTab(event) {
      if (event.key !== "Tab" || !issueInspector.classList.contains("open")) return;
      const focusable = getIssueInspectorFocusable();
      if (focusable.length === 0) return;
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }

    function showIssueInspector() {
      if (issueHideTimeoutId !== null) {
        clearTimeout(issueHideTimeoutId);
        issueHideTimeoutId = null;
      }
      issueInspectorBackdrop.hidden = false;
      issueInspector.hidden = false;
      document.body.classList.add("body-scroll-locked");
      requestAnimationFrame(() => {
        issueInspectorBackdrop.classList.add("open");
        issueInspector.classList.add("open");
        const [first] = getIssueInspectorFocusable();
        if (first) first.focus();
      });
    }

    function closeIssueInspector() {
      document.body.classList.remove("body-scroll-locked");
      issueInspectorBackdrop.classList.remove("open");
      issueInspector.classList.remove("open");
      document.querySelectorAll("[data-issue-row]").forEach((issueRow) => {
        issueRow.classList.remove("selected");
      });
      if (lastFocusedIssueTrigger) {
        lastFocusedIssueTrigger.focus();
        lastFocusedIssueTrigger = null;
      }
      if (issueHideTimeoutId !== null) clearTimeout(issueHideTimeoutId);
      issueHideTimeoutId = setTimeout(() => {
        issueInspectorBackdrop.hidden = true;
        issueInspector.hidden = true;
        issueHideTimeoutId = null;
      }, 250);
    }

    function openIssueInspector(issueId) {
      const issue = currentIssues.find((item) => String(item.id) === issueId);
      if (!issue) return;
      lastFocusedIssueTrigger = document.querySelector(`[data-issue-row="${issueId}"]`) || document.activeElement;

      document.querySelectorAll("[data-issue-row]").forEach((issueRow) => {
        issueRow.classList.toggle("selected", issueRow.dataset.issueRow === String(issueId));
      });

      issueInspectorBody.innerHTML = `
        <section class="detail-block" aria-label="Evidence">
          <h3>Evidence</h3>
          ${renderEvidence(issue.evidence)}
        </section>
        <section class="detail-block" aria-label="Recommended fix">
          <h3>Recommended Fix</h3>
          <p>${escHtml(issue.recommended_fix)}</p>
        </section>
        <section class="detail-block" aria-label="Impact">
          <h3>Impact</h3>
          <p>${escHtml(issue.impact)}</p>
        </section>
      `;

      showIssueInspector();
    }

    let issuesRequestId = 0;

    async function loadIssues({ background = false } = {}) {
      const tableBody = document.getElementById("issueTableBody");
      const requestId = ++issuesRequestId;
      // Issue lookups are normally fast enough that a loader would just
      // flash and disappear -- only show one if this particular request is
      // actually taking a while, instead of unconditionally on every load.
      const loadingTimer = background ? null : setTimeout(() => {
        if (requestId !== issuesRequestId) return;
        tableBody.innerHTML = `<tr><td colspan="6" class="table-loader-cell"><div class="spinner" role="status" aria-label="Loading issues"></div></td></tr>`;
      }, 300);
      try {
        const issues = await fetchIssues();
        clearTimeout(loadingTimer);
        // A slower, older request can resolve after a newer one (eg. a
        // background tick overlapping the initial load, or two ticks
        // overlapping on a slow connection) -- drop it instead of letting
        // it clobber the data a later request already applied.
        if (requestId !== issuesRequestId) return;
        currentIssues = issues;
        // Re-check for an open Issue Inspector *after* the fetch resolves,
        // not just before it starts -- an analyst can open one while a
        // background refresh is in flight, and rebuilding the table here
        // would still reset their page/selection out from under them.
        if (background && issueInspector.classList.contains("open")) return;
        renderIssueRows(currentIssues);
        openRequestedIssue();
      } catch (error) {
        clearTimeout(loadingTimer);
        if (requestId !== issuesRequestId) return;
        if (background) {
          console.error(error);
          return;
        }
        tableBody.innerHTML = `<tr><td colspan="6" class="empty-state" style="text-align: center;">Could not load issues. Is the database configured?</td></tr>`;
      }
    }

    // Arriving from a Session Inspector's "View in Intelligence" badge
    // (/dashboard/intelligence?issue=<uuid>) jumps straight to that issue's
    // row -- paginating to it and opening its Inspector -- instead of
    // leaving an analyst to search for it by hand across however many pages
    // of issues exist.
    let requestedIssueOpened = false;
    function openRequestedIssue() {
      if (requestedIssueOpened) return;
      const requestedIssueId = new URLSearchParams(window.location.search).get("issue");
      if (!requestedIssueId) return;
      const index = currentIssues.findIndex((item) => String(item.id) === requestedIssueId);
      if (index === -1) return;
      requestedIssueOpened = true;
      currentIssuePage = Math.floor(index / ISSUES_PAGE_SIZE) + 1;
      renderIssueRows(currentIssues);
      openIssueInspector(requestedIssueId);
      const row = document.querySelector(`[data-issue-row="${requestedIssueId}"]`);
      if (row) row.scrollIntoView({ block: "center" });
    }

    async function handleStatusToggle(button) {
      const nextStatus = button.classList.contains("open") ? "closed" : "open";
      button.disabled = true;
      try {
        const response = await fetch(`/issues/${button.dataset.issueId}/status`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status: nextStatus })
        });
        if (!response.ok) {
          throw new Error(`Failed to update status (${response.status})`);
        }
        const updated = await response.json();
        button.classList.remove("open", "closed");
        button.classList.add(updated.status);
        button.textContent = statusLabel(updated.status);
        button.setAttribute("aria-pressed", String(updated.status === "closed"));
        const cached = currentIssues.find((item) => item.id === updated.id);
        if (cached) {
          cached.status = updated.status;
        }
      } catch (error) {
        console.error(error);
      } finally {
        button.disabled = false;
      }
    }

    const issueTableBody = document.getElementById("issueTableBody");

    issueTableBody.addEventListener("click", (event) => {
      const statusButton = event.target.closest(".status-toggle");
      if (statusButton) {
        handleStatusToggle(statusButton);
        return;
      }
      if (event.target.closest(".session-count-link")) {
        return;
      }
      const row = event.target.closest("[data-issue-row]");
      if (row) {
        openIssueInspector(row.dataset.issueRow);
      }
    });

    issueTableBody.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") {
        return;
      }
      if (event.target.closest(".status-toggle")) {
        return;
      }
      const row = event.target.closest("[data-issue-row]");
      if (row) {
        event.preventDefault();
        openIssueInspector(row.dataset.issueRow);
      }
    });

    issueInspectorBackdrop.addEventListener("click", closeIssueInspector);
    document.getElementById("issueInspectorCloseBtn").addEventListener("click", closeIssueInspector);
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && issueInspector.classList.contains("open")) {
        closeIssueInspector();
        return;
      }
      trapIssueInspectorTab(event);
    });

    loadIssues();
    setInterval(() => {
      loadIssues({ background: true });
    }, 30000);

    const logoutButton = document.getElementById("logoutButton");
    const logoutConfirmModal = document.getElementById("logoutConfirmModal");

    function getLogoutModalFocusable() {
      return Array.from(
        logoutConfirmModal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')
      ).filter((el) => !el.disabled);
    }

    function openLogoutConfirm() {
      logoutConfirmModal.hidden = false;
      const [first] = getLogoutModalFocusable();
      if (first) first.focus();
    }

    function closeLogoutConfirm() {
      logoutConfirmModal.hidden = true;
      logoutButton.focus();
    }

    function trapLogoutModalTab(event) {
      if (event.key !== "Tab" || logoutConfirmModal.hidden) return;
      const focusable = getLogoutModalFocusable();
      if (focusable.length === 0) return;
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }

    async function performLogout() {
      closeLogoutConfirm();
      logoutButton.disabled = true;
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 10000);
      try {
        const response = await fetch("/auth/logout", { method: "POST", signal: controller.signal });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        window.location.assign("/auth");
      } catch (error) {
        console.error(error);
        alert("Logout failed: " + error.message);
        logoutButton.disabled = false;
        logoutButton.focus();
      } finally {
        clearTimeout(timeoutId);
      }
    }

    logoutButton.addEventListener("click", openLogoutConfirm);
    document.getElementById("logoutConfirmCloseBtn").addEventListener("click", closeLogoutConfirm);
    document.getElementById("logoutCancelBtn").addEventListener("click", closeLogoutConfirm);
    document.getElementById("logoutConfirmBtn").addEventListener("click", performLogout);
    logoutConfirmModal.addEventListener("click", (event) => {
      if (event.target === logoutConfirmModal) closeLogoutConfirm();
    });
    document.addEventListener("keydown", trapLogoutModalTab);
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !logoutConfirmModal.hidden) closeLogoutConfirm();
    });
    // A page restored from the browser's back-forward cache is never
    // re-requested from the server, so a stale, already-logged-out dashboard
    // would otherwise stay visible after Back -- force a real reload so the
    // server's auth check (redirecting to /auth if the session is gone)
    // actually runs again.
    window.addEventListener("pageshow", (event) => {
      if (event.persisted) {
        window.location.reload();
      }
    });
  </script>
</body>
</html>
