<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Intelligence - Echidra OSS | Qyleron</title>
  <link rel="icon" href="/assets/qyleron_logo.png" type="image/png" />
  <link rel="stylesheet" href="/dashboard.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a href="/" class="logo" aria-label="Qyleron home">
        <img src="/assets/Qyleron_Banner.png" alt="Qyleron" />
      </a>
      <div class="product-name">Echidra OSS</div>
    </header>

    <nav class="navbar" aria-label="Primary dashboard navigation">
      <div class="nav-links">
        <a class="nav-link" href="/dashboard">Overview</a>
        <a class="nav-link" href="/dashboard/sessions">Sessions</a>
        <a class="nav-link" href="/dashboard/analytics">Analytics</a>
        <a class="nav-link active" href="/dashboard/intelligence">Intelligence</a>
        <a class="nav-link" href="/dashboard/personas">Personas</a>
      </div>
      <button id="logoutButton" class="logout-button" type="button">Logout</button>
    </nav>

    <main class="dashboard-main">
      <section class="page-panel" aria-labelledby="issuesTitle">
        <div class="page-panel-header">
          <div class="page-panel-title">
            <h1 id="issuesTitle">Issue Intelligence</h1>
            <p>Recurring attacker behavior, the fix that closes it, and whether it's been applied yet.</p>
          </div>
        </div>

        <div class="table-shell">
          <table class="data-table issue-table" aria-describedby="issuesTitle">
            <colgroup>
              <col style="width: 14%;" />
              <col style="width: 7%;" />
              <col style="width: 14%;" />
              <col style="width: 7%;" />
              <col style="width: 7%;" />
              <col style="width: 15%;" />
              <col style="width: 15%;" />
              <col style="width: 12%;" />
              <col style="width: 9%;" />
            </colgroup>
            <thead>
              <tr>
                <th>Event</th>
                <th>Severity</th>
                <th>MITRE Techniques</th>
                <th>Session Count</th>
                <th>Persona Count</th>
                <th>Evidence</th>
                <th>Recommended Fix</th>
                <th>Impact</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="issueTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script>
    const SEVERITY_LABELS = { high: "High", medium: "Medium", low: "Low" };

    function statusLabel(status) {
      return status === "open" ? "Open" : "Closed";
    }

    async function fetchIssues() {
      const response = await fetch("/issues");
      if (!response.ok) {
        throw new Error(`Failed to load issues (${response.status})`);
      }
      return response.json();
    }

    function renderIssueRows(issues) {
      const tableBody = document.getElementById("issueTableBody");
      if (issues.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="9" class="empty-state" style="text-align: center;">No issues detected yet.</td></tr>`;
        return;
      }
      tableBody.innerHTML = issues.map((issue) => `
        <tr data-issue-row="${issue.id}">
          <td><div class="cell-primary"><strong>${issue.title}</strong></div></td>
          <td><span class="risk-badge ${issue.severity}">${SEVERITY_LABELS[issue.severity]}</span></td>
          <td>
            <ul class="mitre-technique-list">
              ${issue.mitre.map((technique) => `<li>${technique.id} - ${technique.name}</li>`).join("")}
            </ul>
          </td>
          <td>${issue.session_count}</td>
          <td>${issue.persona_count}</td>
          <td><span class="cell-bright">${issue.evidence}</span></td>
          <td><span class="cell-bright">${issue.recommended_fix}</span></td>
          <td><span class="cell-bright">${issue.impact}</span></td>
          <td>
            <button
              type="button"
              class="status-toggle ${issue.status}"
              data-issue-id="${issue.id}"
              aria-pressed="${issue.status === "closed"}"
            >${statusLabel(issue.status)}</button>
          </td>
        </tr>
      `).join("");
    }

    async function loadIssues() {
      const tableBody = document.getElementById("issueTableBody");
      try {
        renderIssueRows(await fetchIssues());
      } catch (error) {
        tableBody.innerHTML = `<tr><td colspan="9" class="empty-state" style="text-align: center;">Could not load issues. Is the database configured?</td></tr>`;
      }
    }

    async function handleStatusToggle(event) {
      const button = event.target.closest(".status-toggle");
      if (!button) {
        return;
      }
      const nextStatus = button.classList.contains("open") ? "closed" : "open";
      button.disabled = true;
      try {
        const response = await fetch(`/issues/${button.dataset.issueId}/status`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status: nextStatus })
        });
        if (!response.ok) {
          throw new Error(`Failed to update status (${response.status})`);
        }
        const updated = await response.json();
        button.classList.remove("open", "closed");
        button.classList.add(updated.status);
        button.textContent = statusLabel(updated.status);
        button.setAttribute("aria-pressed", String(updated.status === "closed"));
      } catch (error) {
        console.error(error);
      } finally {
        button.disabled = false;
      }
    }

    loadIssues();
    document.getElementById("issueTableBody").addEventListener("click", handleStatusToggle);

    async function logoutDashboard() {
      const logoutButton = document.getElementById("logoutButton");
      logoutButton.disabled = true;
      try {
        await fetch("/auth/logout", { method: "POST" });
      } finally {
        window.location.assign("/auth");
      }
    }

    document.getElementById("logoutButton").addEventListener("click", logoutDashboard);
  </script>
</body>
</html>
