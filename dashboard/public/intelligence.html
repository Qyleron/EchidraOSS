<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Intelligence - Echidra OSS | Qyleron</title>
  <link rel="icon" href="/assets/qyleron_logo.png" type="image/png" />
  <link rel="stylesheet" href="/dashboard.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-row1">
        <a href="/" class="logo" aria-label="Qyleron home">
          <img src="/assets/Qyleron_Banner.png" alt="Qyleron" />
        </a>
        <div class="product-name">Echidra OSS</div>
      </div>
      <nav class="navbar" aria-label="Primary dashboard navigation">
        <div class="nav-links">
          <a class="nav-link" href="/dashboard">Overview</a>
          <a class="nav-link" href="/dashboard/sessions">Sessions</a>
          <a class="nav-link" href="/dashboard/analytics">Analytics</a>
          <a class="nav-link active" href="/dashboard/intelligence">Intelligence</a>
          <a class="nav-link" href="/dashboard/personas">Personas</a>
          <a class="nav-link" href="/dashboard/alerts">Alerts</a>
        </div>
        <button id="logoutButton" class="logout-button" type="button">Logout</button>
      </nav>
    </header>

    <main class="dashboard-main">
      <section class="page-panel" aria-labelledby="issuesTitle">
        <div class="page-panel-header">
          <div class="page-panel-title">
            <h1 id="issuesTitle">Issue Intelligence</h1>
          </div>
        </div>

        <div class="table-shell">
          <table class="data-table" aria-describedby="issuesTitle">
            <colgroup>
              <col style="width: 28%;" />
              <col style="width: 10%;" />
              <col style="width: 29%;" />
              <col style="width: 11%;" />
              <col style="width: 11%;" />
              <col style="width: 11%;" />
            </colgroup>
            <thead>
              <tr>
                <th>Event</th>
                <th>Severity</th>
                <th>MITRE Techniques</th>
                <th>Session Count</th>
                <th>Persona Count</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="issueTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script>
    const SEVERITY_LABELS = { high: "High", medium: "Medium", low: "Low" };
    let currentIssues = [];

    function escHtml(str) {
      return String(str == null ? "" : str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function escAttr(str) {
      return String(str == null ? "" : str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function statusLabel(status) {
      return status === "open" ? "Open" : "Closed";
    }

    async function fetchIssues() {
      const response = await fetch("/issues");
      if (!response.ok) {
        throw new Error(`Failed to load issues (${response.status})`);
      }
      return response.json();
    }

    function renderIssueRows(issues) {
      const tableBody = document.getElementById("issueTableBody");
      if (issues.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="6" class="empty-state" style="text-align: center;">No issues detected yet.</td></tr>`;
        return;
      }
      tableBody.innerHTML = issues.map((issue) => `
        <tr data-issue-row="${escAttr(issue.id)}" tabindex="0" aria-expanded="false">
          <td><div class="cell-primary"><strong>${escHtml(issue.title)}</strong></div></td>
          <td><span class="risk-badge ${escAttr(issue.severity)}">${escHtml(SEVERITY_LABELS[issue.severity] ?? issue.severity ?? "Unknown")}</span></td>
          <td>
            <ul class="mitre-technique-list">
              ${(issue.mitre || []).map((technique) => `<li>${escHtml(technique.id)} - ${escHtml(technique.name)}</li>`).join("")}
            </ul>
          </td>
          <td>${escHtml(issue.session_count)}</td>
          <td>${escHtml(issue.persona_count)}</td>
          <td>
            <button
              type="button"
              class="status-toggle ${escAttr(issue.status)}"
              data-issue-id="${escAttr(issue.id)}"
              aria-pressed="${issue.status === "closed"}"
            >${escHtml(statusLabel(issue.status))}</button>
          </td>
        </tr>
      `).join("");
    }

    function toggleIssue(issueId) {
      const row = document.querySelector(`[data-issue-row="${issueId}"]`);
      const existingDetail = document.getElementById(`${issueId}-detail`);
      document.querySelectorAll(".issue-detail-row").forEach((detail) => detail.remove());
      document.querySelectorAll("[data-issue-row]").forEach((issueRow) => {
        issueRow.classList.remove("selected");
        issueRow.setAttribute("aria-expanded", "false");
      });

      if (existingDetail) {
        return;
      }

      const issue = currentIssues.find((item) => String(item.id) === issueId);
      row.classList.add("selected");
      row.setAttribute("aria-expanded", "true");
      row.insertAdjacentHTML("afterend", `
        <tr id="${escAttr(issue.id)}-detail" class="issue-detail-row">
          <td colspan="6">
            <div class="issue-detail">
              <section class="detail-block" aria-label="Evidence">
                <h3>Evidence</h3>
                <p>${escHtml(issue.evidence)}</p>
              </section>
              <section class="detail-block" aria-label="Recommended fix">
                <h3>Recommended Fix</h3>
                <p>${escHtml(issue.recommended_fix)}</p>
              </section>
              <section class="detail-block" aria-label="Impact">
                <h3>Impact</h3>
                <p>${escHtml(issue.impact)}</p>
              </section>
            </div>
          </td>
        </tr>
      `);
    }

    async function loadIssues() {
      const tableBody = document.getElementById("issueTableBody");
      try {
        currentIssues = await fetchIssues();
        renderIssueRows(currentIssues);
      } catch (error) {
        tableBody.innerHTML = `<tr><td colspan="6" class="empty-state" style="text-align: center;">Could not load issues. Is the database configured?</td></tr>`;
      }
    }

    async function handleStatusToggle(button) {
      const nextStatus = button.classList.contains("open") ? "closed" : "open";
      button.disabled = true;
      try {
        const response = await fetch(`/issues/${button.dataset.issueId}/status`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status: nextStatus })
        });
        if (!response.ok) {
          throw new Error(`Failed to update status (${response.status})`);
        }
        const updated = await response.json();
        button.classList.remove("open", "closed");
        button.classList.add(updated.status);
        button.textContent = statusLabel(updated.status);
        button.setAttribute("aria-pressed", String(updated.status === "closed"));
        const cached = currentIssues.find((item) => item.id === updated.id);
        if (cached) {
          cached.status = updated.status;
        }
      } catch (error) {
        console.error(error);
      } finally {
        button.disabled = false;
      }
    }

    const issueTableBody = document.getElementById("issueTableBody");

    issueTableBody.addEventListener("click", (event) => {
      const statusButton = event.target.closest(".status-toggle");
      if (statusButton) {
        handleStatusToggle(statusButton);
        return;
      }
      const row = event.target.closest("[data-issue-row]");
      if (row) {
        toggleIssue(row.dataset.issueRow);
      }
    });

    issueTableBody.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") {
        return;
      }
      if (event.target.closest(".status-toggle")) {
        return;
      }
      const row = event.target.closest("[data-issue-row]");
      if (row) {
        event.preventDefault();
        toggleIssue(row.dataset.issueRow);
      }
    });

    loadIssues();

    async function logoutDashboard() {
      const logoutButton = document.getElementById("logoutButton");
      logoutButton.disabled = true;
      try {
        await fetch("/auth/logout", { method: "POST" });
      } finally {
        window.location.assign("/auth");
      }
    }

    document.getElementById("logoutButton").addEventListener("click", logoutDashboard);
  </script>
</body>
</html>
