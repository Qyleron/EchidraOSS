<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard - Echidra OSS | Qyleron</title>
  <link rel="icon" href="/assets/qyleron_logo.png" type="image/png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  <link rel="stylesheet" href="/dashboard.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-row1">
        <a href="/" class="logo" aria-label="Qyleron home">
        <img src="/assets/Qyleron_Banner.png" alt="Qyleron" />
      </a>
      <div class="product-name">Echidra OSS</div>
      </div>
      <nav class="navbar" aria-label="Primary dashboard navigation">
        <div class="nav-links">
        <a class="nav-link active" href="/dashboard">Overview</a>
        <a class="nav-link" href="/dashboard/sessions">Sessions</a>
        <a class="nav-link" href="/dashboard/analytics">Analytics</a>
        <a class="nav-link" href="/dashboard/intelligence">Intelligence</a>
        <a class="nav-link" href="/dashboard/personas">Personas</a>
        <a class="nav-link" href="/dashboard/alerts">Alerts</a>
      </div>
      <button id="logoutButton" class="logout-button" type="button">Logout</button>
      </nav>
    </header>

    <main class="dashboard-main">
      <section class="metric-grid" aria-label="Security overview metrics">
        <article class="metric-card">
          <strong class="metric-value metric-danger" id="metricActiveThreats">—</strong>
          <span class="metric-label">Active Threats</span>
        </article>
        <article class="metric-card">
          <strong class="metric-value metric-success" id="metricLowRisk">—</strong>
          <span class="metric-label">Low Risk Sessions</span>
        </article>
        <article class="metric-card">
          <strong class="metric-value metric-warning" id="metricWarnings">—</strong>
          <span class="metric-label">Warnings</span>
        </article>
        <article class="metric-card">
          <strong class="metric-value" id="metricTotalEvents">—</strong>
          <span class="metric-label">Total Events</span>
        </article>
      </section>

      <section class="overview-grid" aria-label="Threat operations overview">
        <section class="map-panel" aria-label="Global threat map">
          <div class="panel-card">
            <div class="section-heading">
              <h1>Global Threat Map</h1>
              <p>Real-time geographic distribution of security events</p>
            </div>
            <div class="map-frame">
              <div id="attackOriginMap"></div>
            </div>
            <div class="map-legend" aria-label="Map legend">
              <span><i class="legend-dot high-risk"></i>High Risk</span>
              <span><i class="legend-dot medium-risk"></i>Medium Risk</span>
              <span><i class="legend-dot normal-risk"></i>Normal</span>
            </div>
          </div>
        </section>

        <aside class="events-panel" aria-label="Recent security events">
          <div class="panel-card">
            <div class="section-heading">
              <h2>Recent Security Events</h2>
              <p>Latest threats and activities</p>
            </div>
            <div id="eventList" class="event-list"></div>
          </div>
        </aside>
      </section>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script>
    const ACTOR_LABELS = {
      automated_scanner: "Automated scanner",
      brute_force_bot: "Brute-force bot",
      commodity_bot: "Commodity bot",
      script_kiddie: "Script kiddie",
      skilled_human_operator: "Skilled human operator"
    };

    const riskColors = {
      high: "#ff5c70",
      medium: "#ffa726",
      normal: "#51cf66"
    };

    function escHtml(str) {
      return String(str == null ? "" : str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function actorDisplay(actorLabel) {
      if (!actorLabel) return "Unclassified activity";
      return ACTOR_LABELS[actorLabel] || actorLabel;
    }

    function eventTitle(run) {
      return `${actorDisplay(run.actor_label)} — ${(run.protocol || "unknown").toUpperCase()} session`;
    }

    // classifier_runs.risk_level is one of none/low/medium/high/critical;
    // the event badge only has high/medium/low styling.
    function badgeTier(riskLevel) {
      if (riskLevel === "critical" || riskLevel === "high") return "high";
      if (riskLevel === "medium") return "medium";
      return "low";
    }

    // The map legend only has high/medium/normal styling.
    function originTier(riskLevel) {
      if (riskLevel === "critical" || riskLevel === "high") return "high";
      if (riskLevel === "medium") return "medium";
      return "normal";
    }

    function timeAgo(unixSeconds) {
      if (!unixSeconds) return "unknown time";
      const seconds = Math.max(0, Math.floor(Date.now() / 1000 - unixSeconds));
      if (seconds < 60) return `${seconds}s ago`;
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes} min${minutes === 1 ? "" : "s"} ago`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours} hour${hours === 1 ? "" : "s"} ago`;
      const days = Math.floor(hours / 24);
      return `${days} day${days === 1 ? "" : "s"} ago`;
    }

    async function fetchJSON(url) {
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`Request failed for ${url} (${response.status})`);
      }
      return response.json();
    }

    function renderEvents(runs) {
      const eventList = document.getElementById("eventList");
      if (runs.length === 0) {
        eventList.innerHTML = `<div class="empty-state">No classifier runs recorded yet.</div>`;
        return;
      }
      eventList.innerHTML = runs.map((run) => `
        <article class="event-row">
          <div class="event-copy">
            <strong>${escHtml(eventTitle(run))}</strong>
            <span>IP: ${escHtml(run.peer_ip || "unknown")} · Location: ${escHtml(run.country || "Unknown")} · ${escHtml(timeAgo(run.ended_at))}</span>
          </div>
          <span class="risk-badge ${escHtml(badgeTier(run.risk_level))}">${escHtml(run.risk_level)}</span>
        </article>
      `).join("");
    }

    function renderMap(runs) {
      if (!window.L) {
        document.getElementById("attackOriginMap").innerHTML = '<div class="map-fallback">Map library unavailable.</div>';
        return;
      }

      const map = L.map("attackOriginMap", {
        attributionControl: false,
        zoomControl: true,
        worldCopyJump: true
      }).setView([22, 8], 2);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        className: "dark-tiles",
        maxZoom: 18
      }).addTo(map);

      const geolocated = runs.filter((run) => run.latitude != null && run.longitude != null);
      for (const run of geolocated) {
        const tier = originTier(run.risk_level);
        const color = riskColors[tier];
        L.circle([run.latitude, run.longitude], {
          radius: tier === "high" ? 620000 : tier === "medium" ? 430000 : 280000,
          color,
          fillColor: color,
          fillOpacity: tier === "high" ? 0.18 : 0.12,
          opacity: 0.5,
          weight: 1,
          interactive: false
        }).addTo(map);

        L.circleMarker([run.latitude, run.longitude], {
          radius: tier === "high" ? 7 : 5,
          color,
          fillColor: color,
          fillOpacity: 0.9,
          weight: 2
        })
          .bindPopup(
            `<b>${escHtml(run.country || "Unknown")}</b><br>Actor: ${escHtml(actorDisplay(run.actor_label))}<br>Source IP: ${escHtml(run.peer_ip || "unknown")}<br>Risk: ${escHtml(run.risk_level)}`,
          )
          .addTo(map);
      }
    }

    async function loadOverviewMetrics() {
      try {
        const summary = await fetchJSON("/reports/summary");
        document.getElementById("metricActiveThreats").textContent = summary.elevated_runs.toLocaleString();
        document.getElementById("metricLowRisk").textContent = (summary.risk_counts.low || 0).toLocaleString();
        document.getElementById("metricWarnings").textContent = (summary.risk_counts.medium || 0).toLocaleString();
        document.getElementById("metricTotalEvents").textContent = summary.total_runs.toLocaleString();
      } catch (error) {
        console.error(error);
      }
    }

    async function loadRecentActivity() {
      try {
        const runs = await fetchJSON("/classifier/runs?limit=10");
        renderEvents(runs);
        renderMap(runs);
      } catch (error) {
        console.error(error);
        document.getElementById("eventList").innerHTML =
          `<div class="empty-state">Could not load recent activity. Is the database configured?</div>`;
        renderMap([]);
      }
    }

    async function logoutDashboard() {
      const logoutButton = document.getElementById("logoutButton");
      logoutButton.disabled = true;
      try {
        await fetch("/auth/logout", { method: "POST" });
      } finally {
        window.location.assign("/auth");
      }
    }

    document.getElementById("logoutButton").addEventListener("click", logoutDashboard);
    loadOverviewMetrics();
    loadRecentActivity();
  </script>
</body>
</html>
