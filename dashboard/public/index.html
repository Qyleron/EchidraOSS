<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard - Echidra OSS | Qyleron</title>
  <link rel="icon" href="/assets/qyleron_logo.png" type="image/png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  <link rel="stylesheet" href="/dashboard.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a href="/" class="logo" aria-label="Qyleron home">
        <img src="/assets/Qyleron_Banner.png" alt="Qyleron" />
      </a>
      <div class="product-name">Echidra OSS</div>
    </header>

    <nav class="navbar" aria-label="Primary dashboard navigation">
      <div class="nav-links">
        <a class="nav-link active" href="/dashboard">Overview</a>
        <a class="nav-link" href="/dashboard/sessions">Sessions</a>
        <a class="nav-link" href="/dashboard/analytics">Analytics</a>
        <a class="nav-link" href="/dashboard/intelligence">Intelligence</a>
        <a class="nav-link" href="/dashboard/personas">Personas</a>
      </div>
      <button id="logoutButton" class="logout-button" type="button">Logout</button>
    </nav>

    <main class="dashboard-main">
      <section class="metric-grid" aria-label="Security overview metrics">
        <article class="metric-card">
          <strong class="metric-value metric-danger">127</strong>
          <span class="metric-label">Active Threats</span>
        </article>
        <article class="metric-card">
          <strong class="metric-value metric-success">1,489</strong>
          <span class="metric-label">Trusted Sessions</span>
        </article>
        <article class="metric-card">
          <strong class="metric-value metric-warning">43</strong>
          <span class="metric-label">Warnings</span>
        </article>
        <article class="metric-card">
          <strong class="metric-value">2.3M</strong>
          <span class="metric-label">Total Events</span>
        </article>
      </section>

      <section class="overview-grid" aria-label="Threat operations overview">
        <section class="map-panel" aria-label="Global threat map">
          <div class="panel-card">
            <div class="section-heading">
              <h1>Global Threat Map</h1>
              <p>Real-time geographic distribution of security events</p>
            </div>
            <div class="map-frame">
              <div id="attackOriginMap"></div>
            </div>
            <div class="map-legend" aria-label="Map legend">
              <span><i class="legend-dot high-risk"></i>High Risk</span>
              <span><i class="legend-dot medium-risk"></i>Medium Risk</span>
              <span><i class="legend-dot normal-risk"></i>Normal</span>
            </div>
          </div>
        </section>

        <aside class="events-panel" aria-label="Recent security events">
          <div class="panel-card">
            <div class="section-heading">
              <h2>Recent Security Events</h2>
              <p>Latest threats and activities</p>
            </div>
            <div id="eventList" class="event-list"></div>
          </div>
        </aside>
      </section>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script>
    const attackOrigins = [
      { city: "Moscow", country: "Russia", lat: 55.75, lng: 37.62, type: "SSH Brute Force", ip: "185.234.219.x", risk: "high" },
      { city: "Beijing", country: "China", lat: 39.9, lng: 116.4, type: "Suspicious Login", ip: "103.77.166.x", risk: "medium" },
      { city: "Lagos", country: "Nigeria", lat: 6.45, lng: 3.4, type: "Credential Stuffing", ip: "197.210.84.x", risk: "medium" },
      { city: "Sao Paulo", country: "Brazil", lat: -23.55, lng: -46.63, type: "DDoS Attempt", ip: "177.54.144.x", risk: "high" },
      { city: "Tehran", country: "Iran", lat: 35.69, lng: 51.42, type: "SSH Brute Force", ip: "5.160.218.x", risk: "high" },
      { city: "Bucharest", country: "Romania", lat: 44.43, lng: 26.1, type: "FTP Scan", ip: "79.112.33.x", risk: "medium" },
      { city: "Kyiv", country: "Ukraine", lat: 50.45, lng: 30.52, type: "Telnet Probe", ip: "46.211.74.x", risk: "normal" },
      { city: "Amsterdam", country: "Netherlands", lat: 52.37, lng: 4.9, type: "Port Scan", ip: "94.102.56.x", risk: "normal" },
      { city: "Frankfurt", country: "Germany", lat: 50.11, lng: 8.68, type: "HTTP Probe", ip: "185.220.101.x", risk: "medium" },
      { city: "Singapore", country: "Singapore", lat: 1.35, lng: 103.82, type: "SSH Brute Force", ip: "103.21.244.x", risk: "high" },
      { city: "New York", country: "USA", lat: 40.71, lng: -74.01, type: "Port Scan", ip: "198.199.103.x", risk: "normal" },
      { city: "London", country: "UK", lat: 51.51, lng: -0.13, type: "Credential Stuffing", ip: "51.15.112.x", risk: "medium" },
      { city: "San Francisco", country: "USA", lat: 37.77, lng: -122.42, type: "HTTP Probe", ip: "104.131.68.x", risk: "normal" },
      { city: "Paris", country: "France", lat: 48.85, lng: 2.35, type: "FTP Scan", ip: "51.38.185.x", risk: "medium" }
    ];

    const recentEvents = [
      { title: "Brute force attack detected", ip: "192.168.1.100", location: "Russia", time: "2 mins ago", risk: "high" },
      { title: "Suspicious login attempt", ip: "10.0.0.45", location: "China", time: "5 mins ago", risk: "medium" },
      { title: "Normal user authentication", ip: "192.168.1.25", location: "USA", time: "8 mins ago", risk: "low" },
      { title: "DDoS attempt blocked", ip: "172.16.0.99", location: "Brazil", time: "12 mins ago", risk: "high" },
      { title: "HTTP probe fingerprinted", ip: "185.220.101.x", location: "Germany", time: "15 mins ago", risk: "medium" },
      { title: "Known scanner observed", ip: "94.102.56.x", location: "Netherlands", time: "19 mins ago", risk: "low" }
    ];

    const riskColors = {
      high: "#ff5c70",
      medium: "#ffa726",
      normal: "#51cf66",
      low: "#51cf66"
    };

    function renderEvents() {
      const eventList = document.getElementById("eventList");
      eventList.innerHTML = recentEvents.map((event) => `
        <article class="event-row">
          <div class="event-copy">
            <strong>${event.title}</strong>
            <span>IP: ${event.ip} · Location: ${event.location} · ${event.time}</span>
          </div>
          <span class="risk-badge ${event.risk}">${event.risk}</span>
        </article>
      `).join("");
    }

    function renderMap() {
      if (!window.L) {
        document.getElementById("attackOriginMap").innerHTML = '<div class="map-fallback">Map library unavailable.</div>';
        return;
      }

      const map = L.map("attackOriginMap", {
        attributionControl: false,
        zoomControl: true,
        worldCopyJump: true
      }).setView([22, 8], 2);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        className: "dark-tiles",
        maxZoom: 18
      }).addTo(map);

      for (const origin of attackOrigins) {
        const color = riskColors[origin.risk];
        L.circle([origin.lat, origin.lng], {
          radius: origin.risk === "high" ? 620000 : origin.risk === "medium" ? 430000 : 280000,
          color,
          fillColor: color,
          fillOpacity: origin.risk === "high" ? 0.18 : 0.12,
          opacity: 0.5,
          weight: 1
        }).addTo(map);

        L.circleMarker([origin.lat, origin.lng], {
          radius: origin.risk === "high" ? 7 : 5,
          color,
          fillColor: color,
          fillOpacity: 0.9,
          weight: 2
        })
          .bindTooltip(`${origin.city}, ${origin.country}`, {
            permanent: true,
            direction: "top",
            className: "city-label",
            offset: [0, -8]
          })
          .bindPopup(`<b>${origin.city}, ${origin.country}</b><br>Event: ${origin.type}<br>Source IP: ${origin.ip}<br>Risk: ${origin.risk}`)
          .addTo(map);
      }
    }

    async function logoutDashboard() {
      const logoutButton = document.getElementById("logoutButton");
      logoutButton.disabled = true;
      try {
        await fetch("/auth/logout", { method: "POST" });
      } finally {
        window.location.assign("/auth");
      }
    }

    document.getElementById("logoutButton").addEventListener("click", logoutDashboard);
    renderEvents();
    renderMap();
  </script>
</body>
</html>
