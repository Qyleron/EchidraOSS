[project]
name = "echidra-oss"
version = "0.2.0"
description = "Open-source deception platform: decoy SSH, HTTP, FTP and Telnet services that turn attacker activity into MITRE ATT&CK-mapped findings with recommended fixes."
readme = "README.md"
license = { file = "LICENSE.md" }
keywords = [
    "honeypot",
    "cybersecurity",
    "threat-intelligence",
    "intrusion-detection",
    "mitre-attack",
    "ssh-honeypot",
    "deception-technology",
    "security-monitoring",
]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.13.5",
    "psycopg[binary]==3.2.3",
    "python-dotenv==1.2.2",
    "PyYAML==6.0.2",
    "typing_extensions==4.15.0",
    "fastapi==0.141.1",
    "starlette==1.6.0",
    "uvicorn==0.21.0",
    "geoip2fast==1.2.2",
    "cryptography>=42.0.0,<50.0.0",
    "asyncssh==2.24.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "httpx==0.28.1",
]

[project.urls]
Homepage = "https://github.com/Qyleron/EchidraOSS"
Repository = "https://github.com/Qyleron/EchidraOSS"
Issues = "https://github.com/Qyleron/EchidraOSS/issues"

[project.scripts]
echidra = "echidra.cli:main"

[tool.pytest.ini_options]
# benchmarks/flood_test.py matches pytest's *_test.py pattern but is a load
# generator (needs aiohttp), not a test.
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["classifier*", "honeypot*", "echidra*", "dashboard*", "assets*"]

[tool.setuptools.package-data]
"classifier.rules" = ["*.yaml", "*.json"]
# schema.sql is required by `classifier.storage.cli init-db` -- without this,
# a non-editable install is missing the file entirely.
"classifier.storage" = ["*.sql"]
# dashboard/ and assets/ are now real (if code-free) packages purely so
# setuptools has something to hang this package-data on; classifier/api/app.py
# resolves them via importlib.resources first, falling back to the previous
# source-tree-relative path for any install where that lookup doesn't apply.
"dashboard" = ["public/*.html", "public/*.css"]
"assets" = ["*.png"]
