[project]
name = "echidra-oss"
version = "0.1.0"
description = "A deceptive honeypot and post-session attacker-behavior classifier."
requires-python = ">=3.11"
dependencies = [
    "pydantic==1.10.6",
    "psycopg[binary]==3.2.3",
    "python-dotenv==1.0.1",
    "PyYAML==6.0",
    "typing_extensions==4.15.0",
    "fastapi==0.94.0",
    "uvicorn==0.21.0",
    "geoip2fast",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
]

[project.scripts]
echidra = "echidra.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["classifier*", "honeypot*", "echidra*"]
