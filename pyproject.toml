[project]
name = "echidra-oss"
version = "0.1.0"
description = "A deceptive honeypot and post-session attacker-behavior classifier."
readme = "README.md"
license = { file = "LICENSE.md" }
keywords = [
    "honeypot",
    "cybersecurity",
    "threat-intelligence",
    "intrusion-detection",
    "mitre-attack",
    "ssh-honeypot",
    "deception-technology",
    "security-monitoring",
]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.11"
dependencies = [
    "pydantic==1.10.13",
    "psycopg[binary]==3.2.3",
    "python-dotenv==1.2.2",
    "PyYAML==6.0",
    "typing_extensions==4.15.0",
    "fastapi==0.125.0",
    "starlette==0.50.0",
    "uvicorn==0.21.0",
    "geoip2fast==1.2.2",
    "cryptography>=42.0.0,<50.0.0",
    "asyncssh==2.24.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
]

[project.urls]
Homepage = "https://github.com/Qyleron/echidra-oss"
Repository = "https://github.com/Qyleron/echidra-oss"
Issues = "https://github.com/Qyleron/echidra-oss/issues"

[project.scripts]
echidra = "echidra.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["classifier*", "honeypot*", "echidra*", "dashboard*", "assets*"]

[tool.setuptools.package-data]
"classifier.rules" = ["*.yaml", "*.json"]
# schema.sql is required by `classifier.storage.cli init-db` -- without this,
# a non-editable install is missing the file entirely.
"classifier.storage" = ["*.sql"]
# dashboard/ and assets/ are now real (if code-free) packages purely so
# setuptools has something to hang this package-data on; classifier/api/app.py
# resolves them via importlib.resources first, falling back to the previous
# source-tree-relative path for any install where that lookup doesn't apply.
"dashboard" = ["public/*.html", "public/*.css"]
"assets" = ["*.png"]
