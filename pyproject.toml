[project]
name = "echidra-oss"
version = "1.1.1"
description = "Open-source deception platform: decoy SSH, HTTP, FTP and Telnet services that turn attacker activity into MITRE ATT&CK-mapped findings with recommended fixes."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE.md"]
keywords = [
    "honeypot",
    "cybersecurity",
    "threat-intelligence",
    "intrusion-detection",
    "mitre-attack",
    "ssh-honeypot",
    "deception-technology",
    "security-monitoring",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.14.4",
    "psycopg[binary]==3.3.9",
    "python-dotenv==1.2.4",
    "PyYAML==6.0.4",
    "typing_extensions==4.16.0",
    "fastapi==0.165.0",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
    "geoip2fast==1.2.2",
    "cryptography>=42.0.0,<51.0.0",
    "asyncssh==2.24.1",
]

[project.optional-dependencies]
test = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "httpx==0.28.1",
]

[project.urls]
Homepage = "https://qyleron.com"
Documentation = "https://qyleron.com/setup-and-onboarding/"
Repository = "https://github.com/Qyleron/EchidraOSS"
Issues = "https://github.com/Qyleron/EchidraOSS/issues"
Changelog = "https://github.com/Qyleron/EchidraOSS/blob/main/CHANGELOG.md"

[project.scripts]
echidra = "echidra.cli:main"

[tool.pytest.ini_options]
# benchmarks/flood_test.py matches pytest's *_test.py pattern but is a load
# generator (needs aiohttp), not a test.
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["classifier*", "honeypot*", "echidra*", "dashboard*", "assets*"]

[tool.setuptools.package-data]
"classifier.rules" = ["*.yaml", "*.json"]
# schema.sql is required by `classifier.storage.cli init-db` -- without this,
# a non-editable install is missing the file entirely.
"classifier.storage" = ["*.sql"]
# dashboard/ and assets/ are now real (if code-free) packages purely so
# setuptools has something to hang this package-data on; classifier/api/app.py
# resolves them via importlib.resources first, falling back to the previous
# source-tree-relative path for any install where that lookup doesn't apply.
"dashboard" = ["public/*.html", "public/*.css", "public/*.js"]
"assets" = ["*.png"]
# The settings template `echidra init` copies to .env (a copy of the repo's
# .env.example, kept identical by a test) -- a PyPI install has no repo.
"echidra" = ["env.example"]
