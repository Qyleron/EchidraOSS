[project]
name = "echidra-oss"
version = "0.1.0"
description = "A deceptive honeypot and post-session attacker-behavior classifier."
requires-python = ">=3.11"
dependencies = [
    "pydantic==1.10.13",
    "psycopg[binary]==3.2.3",
    "python-dotenv==1.2.2",
    "PyYAML==6.0",
    "typing_extensions==4.15.0",
    "fastapi==0.125.0",
    "starlette==0.50.0",
    "uvicorn==0.21.0",
    "geoip2fast",
    "cryptography>=42.0.0",
    "asyncssh==2.24.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
]

[project.scripts]
echidra = "echidra.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["classifier*", "honeypot*", "echidra*"]

[tool.setuptools.package-data]
"classifier.rules" = ["*.yaml", "*.json"]

# dashboard/public and assets/ live outside these packages and are located at
# runtime via paths relative to the source file (see classifier/api/app.py),
# which only resolves correctly in a source checkout. Only `pip install -e .`
# (per README's Quick Start) is supported; a non-editable wheel install won't
# find them regardless of package-data config.
