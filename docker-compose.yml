services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: echidra
      POSTGRES_PASSWORD: ${ECHIDRA_DB_PASSWORD:?set ECHIDRA_DB_PASSWORD in your .env}
      POSTGRES_DB: echidra
    volumes:
      - echidra_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echidra"]
      interval: 5s
      timeout: 5s
      retries: 10

  honeypot:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "honeypot.main"]
    security_opt:
      - no-new-privileges:true
    # All four listener ports default above 1024, so no capability is needed
    # to bind them. Add "NET_BIND_SERVICE" back to cap_add below if you set
    # any ECHIDRA_*_PORT below 1024 (eg. ECHIDRA_HTTP_PORT=80).
    cap_drop:
      - ALL
    environment:
      ECHIDRA_HOST: 0.0.0.0
      ECHIDRA_PORT: 2222
      ECHIDRA_HTTP_PORT: 8080
      ECHIDRA_FTP_PORT: 2121
      ECHIDRA_TELNET_PORT: 2323
      ECHIDRA_DATABASE_URL: postgresql://echidra:${ECHIDRA_DB_PASSWORD:?set ECHIDRA_DB_PASSWORD in your .env}@db:5432/echidra
      ECHIDRA_INGEST_API_KEY: ${ECHIDRA_INGEST_API_KEY:?set ECHIDRA_INGEST_API_KEY in your .env}
      ECHIDRA_ALERT_SECRET: ${ECHIDRA_ALERT_SECRET:-}
      ECHIDRA_PERSONA: ${ECHIDRA_PERSONA:-generic_linux}
    ports:
      - "2222:2222"
      - "8080:8080"
      - "2121:2121"
      - "2323:2323"
    volumes:
      - echidra_logs:/app/logs
      # Match the host's clock/timezone automatically -- read-only so the
      # container can't affect the host, and no per-user config needed.
      # create_host_path: false makes a host missing these paths (rare, but
      # some minimal/CI hosts lack /etc/timezone) a loud "up" failure instead
      # of Docker's default behavior of silently creating an empty directory
      # at that path on the host and mounting that. If your host hits this,
      # delete both entries below -- the container falls back to UTC.
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /etc/timezone
        target: /etc/timezone
        read_only: true
        bind:
          create_host_path: false
      # SSH_HOST_KEY_PATH defaults to data/ssh_host_key -- without this on a
      # named volume, it lives in the container's writable layer and a fresh
      # key gets generated every time the container is recreated (down/up,
      # a rebuild, a rescheduled pod), not just a plain restart. Returning
      # attackers then see a different host key fingerprint, which most SSH
      # clients flag with a loud "REMOTE HOST IDENTIFICATION HAS CHANGED"
      # warning -- an obvious tell that this is not a real, long-lived host.
      - echidra_ssh_host_key:/app/data
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "classifier.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      ECHIDRA_DATABASE_URL: postgresql://echidra:${ECHIDRA_DB_PASSWORD:?set ECHIDRA_DB_PASSWORD in your .env}@db:5432/echidra
      ECHIDRA_INGEST_API_KEY: ${ECHIDRA_INGEST_API_KEY:?set ECHIDRA_INGEST_API_KEY in your .env}
      ECHIDRA_ALERT_SECRET: ${ECHIDRA_ALERT_SECRET:-}
      ECHIDRA_SESSION_SECRET: ${ECHIDRA_SESSION_SECRET:?set ECHIDRA_SESSION_SECRET in your .env}
      ECHIDRA_COOKIE_SECURE: ${ECHIDRA_COOKIE_SECURE:-false}
      ECHIDRA_ALLOW_SIGNUPS: ${ECHIDRA_ALLOW_SIGNUPS:-false}
    # Bound to the host's loopback only -- unlike the four decoy ports above,
    # the dashboard isn't meant for the same audience. Reach it via an SSH
    # tunnel or your own reverse proxy (see DEPLOYMENT.md), not directly.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - echidra_logs:/app/logs
      # Match the host's clock/timezone automatically -- read-only so the
      # container can't affect the host, and no per-user config needed.
      # create_host_path: false makes a host missing these paths (rare, but
      # some minimal/CI hosts lack /etc/timezone) a loud "up" failure instead
      # of Docker's default behavior of silently creating an empty directory
      # at that path on the host and mounting that. If your host hits this,
      # delete both entries below -- the container falls back to UTC.
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /etc/timezone
        target: /etc/timezone
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
volumes:
  echidra_db_data:
  echidra_logs:
  echidra_ssh_host_key:
