name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - name: pytest
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rfE 2>&1 | tee pytest.log
      - name: Report failures as annotations
        if: failure()
        shell: bash
        run: |
          grep -E "^(FAILED|ERROR) |^E  |Error:|error:|Interrupted" pytest.log | head -40 | while IFS= read -r line; do
            echo "::error title=pytest::${line}"
          done
