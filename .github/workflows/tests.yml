name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - name: pytest
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rfE 2>&1 | tee pytest.log
      - name: Report failures as annotations
        if: failure()
        shell: bash
        run: |
          grep -E "^(FAILED|ERROR) |^E  |Error:|error:|Interrupted" pytest.log | head -40 | while IFS= read -r line; do
            echo "::error title=pytest::${line}"
          done
