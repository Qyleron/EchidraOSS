name: Feature request
description: Suggest an improvement to Echidra.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the need, not only the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Echidra to do?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Who does this help, and any examples?
