# Technique-keyed fix guidance for the Intelligence page's MITRE reference.
#
# Unlike issue_playbook.yaml (keyed by actor_label + technique, used to build
# aggregate Issues with actor-specific copy), this maps every individual MITRE
# technique id the classifier can emit to one canonical explanation that holds
# regardless of which actor triggered it. get_playbook_entry() in
# mitre_playbook.py falls back to a generic entry for any technique id not
# listed here, so newly observed classifier output never renders blank.
#
# Every mitre_tags value used in classifier/rules/default_rules.yaml must have
# an entry here.

T1005:
  name: Data from Local System
  recommended_fix: Tune decoy file placement so sensitive-looking files are the ones being read, and alert on any read of a real credential or configuration file.
  impact: Confirms which local files attract attacker attention and where equivalent monitoring is worth adding on real systems.

T1046:
  name: Network Service Discovery
  recommended_fix: Close every port you don't use, and keep the services you do run on their usual ports behind a firewall that only admits the addresses that need them.
  impact: Leaves scanners less to find, so fewer of your services end up on the target lists bots work from.

T1059:
  name: Command and Scripting Interpreter
  recommended_fix: Flag interactive, low-and-slow shell sessions for manual review and keep the session open long enough to observe further behavior before disconnecting.
  impact: Separates scripted bot traffic from real human operators, who carry more investigative value.

T1078.001:
  name: Default Accounts
  recommended_fix: Change the factory username and password on every network device before it is reachable, turn Telnet off in favour of SSH, and keep device management ports off the public internet.
  impact: Closes the way in that IoT botnets rely on, since they only try the passwords devices ship with.

T1082:
  name: System Information Discovery
  recommended_fix: Trim shell banner and uname detail, randomize first-command response timing, and alert on rapid fingerprinting sequences.
  impact: Shortens the window an attacker has to fingerprint the system before staging a payload.

T1087:
  name: Account Discovery
  recommended_fix: Return uniform responses with no user-existence hints, and rate-limit account-enumeration command bursts.
  impact: Removes the reconnaissance signal scanners use to pick high-value accounts to target next.

T1090:
  name: Proxy
  recommended_fix: Make sure no proxy you run accepts connections from the internet without a login, and refuse CONNECT requests on web servers that are not meant to be proxies.
  impact: Keeps your servers from carrying other people's attack and spam traffic under your address.

T1098.004:
  name: SSH Authorized Keys
  recommended_fix: Disable password login over SSH, review every authorized_keys file for keys you don't recognize, and alert on any change to those files.
  impact: Removes a way back in that survives a password change, since a planted key keeps working until someone finds and deletes it.

T1105:
  name: Ingress Tool Transfer
  recommended_fix: Block outbound connections from servers to addresses they have no reason to reach, disable password login over SSH, and alert on download tools (wget, curl, scp, tftp) run by an interactive login.
  impact: Stops a successful login from turning into installed malware, which is the step that converts a guessed password into a compromised host.

T1110:
  name: Brute Force
  recommended_fix: Rate-limit or temporarily block source IPs that exceed a connection or login-attempt threshold within a short window.
  impact: Catches automated credential hammering even on listeners with no real authentication to brute-force.

T1110.001:
  name: Password Guessing
  recommended_fix: Disable password login where keys or single sign-on can be used, enforce strong unique passwords elsewhere, and change any password an attacker has been seen using successfully.
  impact: Makes a guessed password worthless, and cuts off reuse of one that was already confirmed.

T1190:
  name: Exploit Public-Facing Application
  recommended_fix: Patch or isolate the fingerprinted service/version, and alert when a known exploit tool name or payload signature appears in a session.
  impact: Closes the gap between a scanner finding a vulnerable-looking service and an attacker acting on it.

T1552.001:
  name: Credentials In Files
  recommended_fix: Remove plaintext credentials from disk, rotate decoy credentials periodically, and alert on any credential-file read.
  impact: Closes a common, low-effort path to lateral movement from a single compromised host.

T1592:
  name: Gather Victim Host Information
  recommended_fix: Keep remote management (WinRM, ports 5985 and 5986) and services that use Windows sign-in off the public internet or behind a VPN, and turn off NTLM where you can.
  impact: Removes the host details attackers use to choose which exploits and passwords to try.

T1595.002:
  name: Vulnerability Scanning
  recommended_fix: Keep products with known flaws or no login by default (cameras, GeoServer, AI tool or model servers) off the public internet or behind a login, and apply vendor fixes promptly.
  impact: Closes the opening these scans look for before a bot comes back with the exploit.

T1595:
  name: Active Scanning
  recommended_fix: Rate-limit connections per source IP and correlate scanning activity across personas and protocols.
  impact: Surfaces reconnaissance sweeps early, before an attacker commits to a specific target.
