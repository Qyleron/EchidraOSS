# Knowledge base for the Intelligence page: maps an (actor_label, MITRE
# technique) pair observed in real classifier_runs/classifier_signals to a
# recommended fix. This is intentionally a lookup table, not a model -- the
# fix is rule-based, but it's triggered by what your honeypot actually
# captured, not by a hardcoded example. A pair with no entry here still
# produces an issue (title/fix fall back to a generic description), so new
# attacker behavior always surfaces even before you've written copy for it.
#
# MITRE technique display names come from classifier/rules/mitre_technique_names.json
# (the full ATT&CK catalog). mitre_technique_names below is only for
# overriding a specific id's display name; empty by default.
mitre_technique_names: {}

actor_label_names:
  automated_scanner: Automated scanners
  brute_force_bot: Brute-force bots
  commodity_bot: Commodity bots
  script_kiddie: Script kiddies
  skilled_human_operator: Skilled human operators

fixes:
  # brute_force_bot/T1110 comes from two places that share this one fix
  # entry: default_rules.yaml's authentication_attempt and
  # repeat_connections_same_ip rules (via classifier_runs), and issue_sync's
  # own repeat-connection check (classifier/storage/issue_sync.py), computed
  # directly off raw connection frequency per source IP in `sessions`. Both
  # paths upsert to the same deterministic issue ID (see _issue_id_for_pair
  # in issue_sync.py), so they consolidate into one issue instead of
  # duplicating it -- the repeat-connection check runs last in
  # sync_issues_from_classifier_runs and wins, since it's the more precise,
  # purpose-built measurement of this specific behavior.
  brute_force_bot:
    T1110:
      title: The same source IP is reconnecting far more often than normal, consistent with automated credential or access testing.
      recommended_fix: Rate-limit or temporarily block source IPs that exceed a connection threshold within a short window (fail2ban-style), and watch for the same IP touching multiple personas.
      impact: Catches automated hammering even though this honeypot has no password prompt to literally brute-force.

  automated_scanner:
    T1087:
      title: Automated scanners are enumerating accounts before deciding where to focus.
      recommended_fix: Return uniform error messages with no user-existence hints, and rate-limit account-discovery command bursts.
      impact: Removes the reconnaissance signal scanners use to pick high-value targets.
    T1082:
      title: Automated scanners are fingerprinting the system before staging payloads.
      recommended_fix: Trim shell banner detail, randomize first-command response timing, and alert on rapid fingerprinting sequences with no clean exit.
      impact: Shortens attacker dwell time before detection.

  commodity_bot:
    T1005:
      title: Commodity bots are reading local files surfaced as decoys.
      recommended_fix: Tune decoy file placement and add tripwire alerts on sensitive-file reads.
      impact: Confirms which decoy bait is effective and where real systems should add equivalent monitoring.
    T1552.001:
      title: Commodity bots are searching for credentials stored in files.
      recommended_fix: Remove plaintext credentials from disk, rotate decoy credentials periodically, and alert on credential-file access.
      impact: Closes a common, low-effort path to lateral movement.

  skilled_human_operator:
    T1059:
      title: A skilled human operator is interacting with the shell at an interactive, low-and-slow pace.
      recommended_fix: Flag low-and-slow interactive sessions for manual review and extend engagement to gather more attacker behavior before disconnecting.
      impact: Distinguishes scripted bots from real human operators, who carry more investigative value.
