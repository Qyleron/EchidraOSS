# Knowledge base for the Intelligence page: maps an (actor_label, MITRE
# technique) pair observed in real classifier_runs/classifier_signals to a
# recommended fix. This is intentionally a lookup table, not a model -- the
# fix is rule-based, but it's triggered by what your honeypot actually
# captured, not by a hardcoded example. A pair with no entry here still
# produces an issue (title/fix fall back to a generic description), so new
# attacker behavior always surfaces even before you've written copy for it.
#
# MITRE technique display names come from classifier/rules/mitre_technique_names.json
# (the full ATT&CK catalog). mitre_technique_names below is only for
# overriding a specific id's display name; empty by default.
mitre_technique_names: {}

actor_label_names:
  automated_scanner: Automated scanners
  brute_force_bot: Brute-force bots
  commodity_bot: Commodity bots
  script_kiddie: Script kiddies
  skilled_human_operator: Skilled human operators

fixes:
  # brute_force_bot/T1110 comes from two places that share this one fix
  # entry: default_rules.yaml's authentication_attempt and
  # repeat_connections_same_ip rules (via classifier_runs), and issue_sync's
  # own repeat-connection check (classifier/storage/issue_sync.py), computed
  # directly off raw connection frequency per source IP in `sessions`. Both
  # paths upsert to the same deterministic issue ID (see _issue_id_for_pair
  # in issue_sync.py), so they consolidate into one issue instead of
  # duplicating it -- the repeat-connection check runs last in
  # sync_issues_from_classifier_runs and wins, since it's the more precise,
  # purpose-built measurement of this specific behavior.
  brute_force_bot:
    T1110:
      title: The same source IP is reconnecting far more often than normal, consistent with automated credential or access testing.
      recommended_fix: Rate-limit or temporarily block source IPs that exceed a connection threshold within a short window (fail2ban-style), and watch for the same IP touching multiple personas.
      impact: Catches automated hammering even though this honeypot has no password prompt to literally brute-force.
    T1110.001:
      title: Brute-force bots are confirming that a guessed SSH password works, then leaving.
      recommended_fix: Disable password login over SSH and use keys. Change any password that appears in these sessions if it is used on a real system, since a confirmed password is usually used later from a different address.
      impact: Stops a confirmed password from being reused, which is the step that usually follows from a different address.

  automated_scanner:
    T1087:
      title: Automated scanners are enumerating accounts before deciding where to focus.
      recommended_fix: Return uniform error messages with no user-existence hints, and rate-limit account-discovery command bursts.
      impact: Removes the reconnaissance signal scanners use to pick high-value targets.
    T1082:
      title: Automated scanners are fingerprinting the system before staging payloads.
      recommended_fix: Trim shell banner detail, randomize first-command response timing, and alert on rapid fingerprinting sequences with no clean exit.
      impact: Shortens attacker dwell time before detection.
    T1595:
      title: Automated scanners are touching FTP/Telnet ports without submitting real credentials, consistent with a banner-grab or port sweep.
      recommended_fix: Rate-limit connections per source IP across these ports and correlate banner-grab activity with later credential-stuffing attempts from the same IP.
      impact: Surfaces the reconnaissance sweep that typically precedes a targeted credential-stuffing run, before it arrives.
    # Hikvision camera, GeoServer and AI server checks share this finding.
    T1595.002:
      title: Automated scanners are checking for products with a known flaw or no login by default, such as Hikvision cameras, GeoServer, and AI tool or model servers.
      recommended_fix: Keep cameras, GeoServer, and AI tool (MCP) or model servers off the public internet, or behind a VPN or a login, and apply the vendor fixes for Hikvision (CVE-2021-36260) and GeoServer (CVE-2024-36401).
      impact: Closes the opening these scans look for before a bot comes back with the exploit.
    T1190:
      title: Automated scanners are using path traversal (../) to read system files through the web server.
      recommended_fix: Keep web servers and apps updated, make sure no request can reach files outside the web root, and alert on request paths containing ../ or its encoded forms.
      impact: Stops one request from exposing system files or the app's own secrets.
    T1046:
      title: Automated scanners are sending web, TLS, SSH and remote-desktop openings to the FTP port, looking for services on unexpected ports.
      recommended_fix: Close every port you don't use, and keep the services you do run on their usual ports behind a firewall that only admits the addresses that need them.
      impact: Leaves scanners less to find, so fewer of your services end up on the target lists bots work from.
    T1090:
      title: Automated scanners are testing whether this server will relay their traffic as an open proxy.
      recommended_fix: Make sure no proxy you run accepts connections from the internet without a login, and refuse CONNECT requests on web servers that are not meant to be proxies.
      impact: Keeps your servers from carrying other people's attack and spam traffic under your address.
    # WinRM requests and password-less Windows sign-ins share this finding.
    T1592:
      title: Automated scanners are probing Windows remote management (WinRM) and Windows sign-in, which reveal the Windows version, host name and domain.
      recommended_fix: Keep WinRM (ports 5985 and 5986) and web services that use Windows sign-in off the public internet or behind a VPN, and turn off NTLM where you can.
      impact: Removes the host details bots use to choose which Windows exploits and passwords to try.

  commodity_bot:
    T1005:
      title: Commodity bots are reading local files surfaced as decoys.
      recommended_fix: Tune decoy file placement and add tripwire alerts on sensitive-file reads.
      impact: Confirms which decoy bait is effective and where real systems should add equivalent monitoring.
    T1552.001:
      title: Commodity bots are searching for credentials stored in files.
      recommended_fix: Make sure web servers never serve .env, .git, cloud credential or config files, remove plaintext credentials from disk, and alert on credential-file access.
      impact: Closes a common, low-effort path to lateral movement.
    # Every commodity bot that acted after an SSH login also carries T1110.
    # Alerts list techniques most serious first, so the download, key or
    # inspection fix still leads; this finding groups the logins themselves.
    T1110:
      title: Commodity bots are getting into SSH with guessed passwords before running their next step.
      recommended_fix: Disable password login over SSH and use keys. Change any password seen in these sessions if it is used on a real system, and alert on a successful password login from an address that has failed many times.
      impact: Removes the way in that every later step of these sessions depends on.
    T1078.001:
      title: A known Mirai-family default credential was submitted over Telnet, consistent with an IoT botnet's fixed wordlist rather than generic brute-forcing.
      recommended_fix: Treat these hits as an IoT botnet campaign indicator distinct from ordinary brute-force traffic -- cross-reference the source IP against known Mirai C2/scanner ranges and prioritize alerting over rate-limiting alone, since these bots don't back off.
      impact: Separates commodity IoT botnet scanning (large volume, low sophistication, fixed wordlist) from targeted brute-force attempts, so response effort goes to the right one.
    # SSH downloads and HTTP command injection both carry T1105. HTTP
    # sessions lead with T1190 below, so their alerts use that fix.
    T1105:
      title: Commodity bots are downloading and running a program, after logging in over SSH or through a flaw in a web app or device.
      recommended_fix: Block outbound connections from servers and devices to addresses they have no reason to reach, disable password login over SSH, and alert on download tools (wget, curl, scp, tftp) run by a login or a web service.
      impact: Stops a way in from turning into installed malware, and the download address in the session is an indicator you can block.
    T1190:
      title: Commodity bots are sending exploits that make routers, cameras and web apps download and run malware.
      recommended_fix: Update the firmware or software on every internet-facing device and web app, keep device admin pages off the public internet, and block outbound connections from devices to addresses they have no reason to reach.
      impact: Closes the flaw the bot used, and the download address in the session is an indicator you can block.
    T1098.004:
      title: Commodity bots are adding their own login key to authorized_keys after logging in over SSH.
      recommended_fix: Disable password login over SSH, review every authorized_keys file for keys you don't recognize, and alert on any change to those files.
      impact: Removes a way back in that survives a password change, since a planted key keeps working until someone finds and deletes it.
    # Worded to hold for any commodity bot carrying T1082, not only the
    # ssh_system_binary_read rule: the discovery rules use the same tag.
    T1082:
      title: Commodity bots are inspecting the system after logging in over SSH, such as reading a program file to learn the CPU type, before choosing what to run.
      recommended_fix: Disable password login over SSH, and alert when an interactive login prints a program file or runs a burst of system-inspection commands. Treat it as the step before a malware download.
      impact: Catches an intrusion at the inspection step, before anything has been downloaded or installed.

  skilled_human_operator:
    T1059:
      title: A skilled human operator is interacting with the shell at an interactive, low-and-slow pace.
      recommended_fix: Flag low-and-slow interactive sessions for manual review and extend engagement to gather more attacker behavior before disconnecting.
      impact: Distinguishes scripted bots from real human operators, who carry more investigative value.
