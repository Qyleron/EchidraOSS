rules_version: "1.0.0"
rules:
  - id: automated_discovery_burst
    name: Automated discovery burst
    actor_label: automated_scanner
    confidence: 0.72
    risk_score: 35
    mitre_tags:
      - T1087
      - T1082
    evidence:
      - High command rate with repeated discovery commands.
      - No clean exit command was observed.
    conditions:
      - field: commands_per_minute
        operator: gte
        value: 20
      - field: discovery_command_count
        operator: gte
        value: 3
      - field: exit_command_present
        operator: equals
        value: false

  - id: sensitive_file_probe
    name: Sensitive file probe
    actor_label: commodity_bot
    confidence: 0.78
    risk_score: 55
    mitre_tags:
      - T1005
      - T1552.001
    evidence:
      - Session attempted to read sensitive-looking fake files.
      - Decoy file exposure gives persona-specific context.
    conditions:
      - field: sensitive_file_read_count
        operator: gte
        value: 1
      - field: decoy_files_surfaced_count
        operator: gte
        value: 1

  - id: repeat_connections_same_ip
    name: Repeat connections from same source IP
    actor_label: brute_force_bot
    confidence: 0.75
    risk_score: 55
    mitre_tags:
      - T1110
    evidence:
      - Source IP reconnected at least 5 times in 24 hours, consistent with automated credential or access testing.
    conditions:
      - field: connection_count_from_same_ip
        operator: gte
        value: 5

  - id: authentication_attempt
    name: Authentication attempt observed
    actor_label: brute_force_bot
    confidence: 0.7
    risk_score: 55
    mitre_tags:
      - T1110
    evidence:
      - A complete credential submission (username and password) was observed during the active session.
    conditions:
      # >= 2 requires both a username and a password to have been submitted --
      # a bare, unfinished username line (auth_attempt_count == 1) isn't
      # evidence of a login attempt at all. Note this can't require *repeated*
      # attempts: FtpHandler and TelnetHandler each accept exactly one
      # USER/PASS exchange per connection by design (see their docstrings),
      # so a genuinely repeated pattern only shows up across sessions --
      # that's what repeat_connections_same_ip is for.
      - field: auth_attempt_count
        operator: gte
        value: 2

  - id: script_kiddie_tool_names
    name: Known tool name typed in the shell
    actor_label: script_kiddie
    confidence: 0.7
    risk_score: 40
    mitre_tags:
      - T1595
      - T1190
    evidence:
      - A known exploit or scanning tool name was typed directly in the session, consistent with running pre-packaged attack tooling rather than manual exploration.
    conditions:
      - field: protocol
        operator: equals
        value: tcp_shell
      - field: command_names
        operator: contains_any
        value:
          - sqlmap
          - nikto
          - hydra
          - nmap
          - masscan
          - metasploit
          - msfconsole
          - gobuster
          - dirb
          - dirsearch
          - wfuzz
          - burpsuite
          - john
          - hashcat

  # The highest-signal thing a shell session can do: bring a program onto
  # the host and run it. risk_score is set so the session still lands in
  # "high" once averaged with authentication_attempt (which every logged-in
  # SSH session also matches) -- see _combined_risk_score.
  - id: ssh_remote_payload_fetch_and_run
    name: Remote program fetched and run after login
    actor_label: commodity_bot
    confidence: 0.9
    risk_score: 90
    mitre_tags:
      - T1105
    evidence:
      - After logging in, the session tried to download a program from a remote host (scp, wget, curl or tftp) and run it.
    conditions:
      - field: protocol
        operator: equals
        value: tcp_shell
      - field: remote_fetch_and_run_attempt
        operator: equals
        value: true

  # Leaving a key behind is an attempt to keep access after the password
  # changes. Scored like the rule above, for the same averaging reason.
  - id: ssh_authorized_key_install
    name: SSH login key added after login
    actor_label: commodity_bot
    confidence: 0.9
    risk_score: 90
    mitre_tags:
      - T1098.004
    evidence:
      - After logging in, the session wrote a public key into an SSH authorized_keys file, which would let its owner log back in without a password.
    conditions:
      - field: protocol
        operator: equals
        value: tcp_shell
      - field: authorized_keys_write_attempt
        operator: equals
        value: true

  # The step before a download: the loader prints a program file to read
  # its header and learn the CPU type. risk_score is just high enough for
  # this rule to decide the actor label over the generic login rules; the
  # session itself lands in "medium" once averaged with them, below a
  # download or a planted key.
  - id: ssh_system_binary_read
    name: System program read to identify the CPU type
    actor_label: commodity_bot
    confidence: 0.8
    risk_score: 65
    mitre_tags:
      - T1082
    evidence:
      - After logging in, the session printed a program file from a system directory (for example cat /bin/echo), which a malware loader does to learn the CPU type before choosing what to download.
    conditions:
      - field: protocol
        operator: equals
        value: tcp_shell
      - field: system_binary_read_attempt
        operator: equals
        value: true

  - id: ssh_login_check
    name: Guessed SSH password confirmed with a test command
    actor_label: brute_force_bot
    confidence: 0.8
    risk_score: 60
    mitre_tags:
      - T1110.001
    evidence:
      - After logging in with a guessed password, the session only ran a test command such as echo OK, which a bot does to confirm the password works before reporting it or coming back.
    conditions:
      - field: protocol
        operator: equals
        value: tcp_shell
      - field: login_check_only
        operator: equals
        value: true

  - id: scripted_probe_with_clean_exit
    name: Scripted probe with clean exit
    actor_label: script_kiddie
    confidence: 0.6
    risk_score: 30
    mitre_tags:
      - T1082
      - T1087
    evidence:
      - Ran a short sequence of common discovery commands, then exited cleanly.
      - Repeated commands suggest a copy-pasted script rather than independent exploration.
    conditions:
      - field: protocol
        operator: equals
        value: tcp_shell
      - field: discovery_command_count
        operator: gte
        value: 2
      - field: repeated_command_count
        operator: gte
        value: 1
      - field: exit_command_present
        operator: equals
        value: true
      - field: command_count
        operator: lte
        value: 8

  - id: interactive_low_and_slow
    name: Interactive low and slow shell use
    actor_label: skilled_human_operator
    confidence: 0.64
    risk_score: 45
    mitre_tags:
      - T1059
    evidence:
      - Commands arrived at a slower interactive cadence.
      - Session used multiple unique commands.
    conditions:
      - field: average_inter_command_interval_seconds
        operator: gte
        value: 2
      - field: unique_command_count
        operator: gte
        value: 3
      - field: command_count
        operator: gte
        value: 4

  # FtpHandler and TelnetHandler each accept exactly one USER/PASS exchange
  # per connection (see their docstrings), so the same two behaviors show up
  # identically on both protocols: a connection that never sends a
  # recognizable credential line at all (banner-grab/port-scan, not actual
  # credential testing), and a completed USER+PASS pair submitted at
  # bot speed. commands_per_minute >= 120 means both lines arrived within
  # about half a second of each other -- not achievable by a human typing.
  - id: ftp_banner_probe_no_credentials
    name: FTP connection with no credential attempt
    actor_label: automated_scanner
    confidence: 0.55
    risk_score: 20
    mitre_tags:
      - T1595
    evidence:
      - Connected to the FTP service but never submitted a recognizable USER command.
    conditions:
      - field: protocol
        operator: equals
        value: ftp
      - field: auth_attempt_count
        operator: equals
        value: 0
      - field: command_count
        operator: gte
        value: 1
      - field: ftp_other_protocol_probe
        operator: equals
        value: false

  - id: ftp_other_protocol_probe
    name: Another protocol sent to the FTP port
    actor_label: automated_scanner
    confidence: 0.8
    risk_score: 20
    mitre_tags:
      - T1046
    evidence:
      - Opened with another protocol (a web request, an SSH version line, or a TLS or remote-desktop handshake) instead of FTP, which is how scanners find services running on unexpected ports.
    conditions:
      - field: protocol
        operator: equals
        value: ftp
      - field: ftp_other_protocol_probe
        operator: equals
        value: true

  - id: ftp_automated_credential_burst
    name: Automated FTP credential submission
    actor_label: brute_force_bot
    confidence: 0.75
    risk_score: 50
    mitre_tags:
      - T1110
    evidence:
      - Username and password arrived within roughly half a second of each other, consistent with scripted credential testing rather than a manual attempt.
    conditions:
      - field: protocol
        operator: equals
        value: ftp
      - field: auth_attempt_count
        operator: gte
        value: 2
      - field: commands_per_minute
        operator: gte
        value: 120

  - id: telnet_banner_probe_no_credentials
    name: Telnet connection with no credential attempt
    actor_label: automated_scanner
    confidence: 0.55
    risk_score: 20
    mitre_tags:
      - T1595
    evidence:
      - Connected to the Telnet service but never submitted a recognizable login line.
    conditions:
      - field: protocol
        operator: equals
        value: telnet
      - field: auth_attempt_count
        operator: equals
        value: 0
      - field: command_count
        operator: gte
        value: 1

  - id: telnet_automated_credential_burst
    name: Automated Telnet credential submission
    actor_label: brute_force_bot
    confidence: 0.8
    risk_score: 55
    mitre_tags:
      - T1110
    evidence:
      - Username and password arrived within roughly half a second of each other, consistent with Mirai-family IoT botnet credential stuffing.
    conditions:
      - field: protocol
        operator: equals
        value: telnet
      - field: auth_attempt_count
        operator: gte
        value: 2
      - field: commands_per_minute
        operator: gte
        value: 120

  - id: mirai_iot_credential_burst
    name: Known Mirai-family IoT default credential submitted over Telnet
    actor_label: commodity_bot
    confidence: 0.85
    risk_score: 65
    mitre_tags:
      - T1078.001
    evidence:
      - The submitted username/password pair matches a known Mirai-family default credential, consistent with an IoT botnet's fixed wordlist rather than opportunistic server credential stuffing.
    conditions:
      - field: protocol
        operator: equals
        value: telnet
      # Only device-specific factory passwords from the Mirai wordlist.
      # Pairs every generic wordlist also carries (admin:admin, root:root,
      # root:toor, ...) are left to the brute_force_bot rules, so this rule
      # names an IoT botnet only when the password itself points to one.
      - field: telnet_credentials_tried
        operator: contains_any
        value:
          - "root:vizxv"
          - "root:xc3511"
          - "root:zte521"

  - id: http_sensitive_path_probe
    name: HTTP request for a secret or configuration file
    actor_label: commodity_bot
    confidence: 0.7
    risk_score: 45
    mitre_tags:
      - T1552.001
    evidence:
      - Requested a file that often holds passwords, keys or configuration secrets (eg. .env, .git/config, .aws/credentials, config.json, wp-config.php).
    conditions:
      - field: protocol
        operator: equals
        value: http
      - field: sensitive_file_read_count
        operator: gte
        value: 1
      # "/../../etc/passwd" is a path traversal attempt; that rule names it.
      - field: http_path_traversal_attempt
        operator: equals
        value: false

  - id: http_credential_harvest_attempt
    name: HTTP credential submission
    actor_label: brute_force_bot
    confidence: 0.72
    risk_score: 50
    mitre_tags:
      - T1110
    evidence:
      - Submitted a username and password over HTTP, in a login form, a login link's query string or a Basic authentication header.
    conditions:
      - field: protocol
        operator: equals
        value: http
      - field: auth_attempt_count
        operator: gte
        value: 1

  - id: http_known_scanner_user_agent
    name: Known scanner User-Agent
    actor_label: automated_scanner
    confidence: 0.75
    risk_score: 40
    mitre_tags:
      - T1595
    evidence:
      - Request carried a User-Agent header naming a known vulnerability or reconnaissance scanner (eg. masscan, nikto, sqlmap).
    conditions:
      - field: protocol
        operator: equals
        value: http
      - field: http_known_scanner_user_agent
        operator: equals
        value: true

  # The request is the attack, aimed at a known flaw in a router, camera or
  # web app (eg. /goform/, /tmUnblock.cgi, /GponForm/, GeoServer's WFS).
  # It usually matches alone, so 80 lands it in "high", where SSH download
  # sessions land once averaged with the login rule.
  - id: http_command_injection
    name: Command injected into a web request
    actor_label: commodity_bot
    confidence: 0.9
    risk_score: 80
    mitre_tags:
      - T1190
      - T1105
    evidence:
      - The request carried a shell download command (wget, curl or tftp) or a Java exec call, aimed at a known flaw in a router, camera or web app, to make it download and run a program.
    conditions:
      - field: protocol
        operator: equals
        value: http
      - field: http_command_injection_attempt
        operator: equals
        value: true

  - id: http_path_traversal
    name: Path traversal to read files outside the web root
    actor_label: automated_scanner
    confidence: 0.8
    risk_score: 60
    mitre_tags:
      - T1190
    evidence:
      - The request path climbs out of the web root with ../ (often URL-encoded) to read a system file such as /etc/passwd.
    conditions:
      - field: protocol
        operator: equals
        value: http
      - field: http_path_traversal_attempt
        operator: equals
        value: true

  - id: http_open_proxy_probe
    name: Open proxy test
    actor_label: automated_scanner
    confidence: 0.8
    risk_score: 35
    mitre_tags:
      - T1090
    evidence:
      - Asked the server to connect to another site (a CONNECT request or a full URL as the request target), which is how bots find open proxies to send their own traffic through.
    conditions:
      - field: protocol
        operator: equals
        value: http
      - field: http_proxy_request
        operator: equals
        value: true

  - id: http_hikvision_camera_probe
    name: Check for a Hikvision camera
    actor_label: automated_scanner
    confidence: 0.85
    risk_score: 35
    mitre_tags:
      - T1595.002
    evidence:
      - Requested /SDK/webLanguage, a page Hikvision cameras serve. Bots check for it before sending the command injection that takes over unpatched cameras (CVE-2021-36260).
    conditions:
      - field: protocol
        operator: equals
        value: http
      - field: http_probe_targets
        operator: contains
        value: hikvision_camera
      # The probe rules describe a check. A request that also carries the
      # exploit is named by http_command_injection instead.
      - field: http_command_injection_attempt
        operator: equals
        value: false

  - id: http_geoserver_probe
    name: Check for a GeoServer install
    actor_label: automated_scanner
    confidence: 0.8
    risk_score: 35
    mitre_tags:
      - T1595.002
    evidence:
      - Requested a GeoServer page. Bots look for GeoServer installs missing the fix for a remote code execution flaw (CVE-2024-36401).
    conditions:
      - field: protocol
        operator: equals
        value: http
      - field: http_probe_targets
        operator: contains
        value: geoserver
      - field: http_command_injection_attempt
        operator: equals
        value: false

  - id: http_ai_server_probe
    name: Scan for exposed AI tool or model servers
    actor_label: automated_scanner
    confidence: 0.8
    risk_score: 35
    mitre_tags:
      - T1595.002
    evidence:
      - Requested the address of an MCP (AI tool) server or an OpenAI-style model API (eg. /mcp, /sse, /v1/models). Bots look for these left open without a login, to run their tools or use the models.
    conditions:
      - field: protocol
        operator: equals
        value: http
      - field: http_probe_targets
        operator: contains_any
        value:
          - mcp_server
          - ai_model_api
      - field: http_command_injection_attempt
        operator: equals
        value: false

  - id: http_winrm_probe
    name: Windows remote management (WinRM) probe
    actor_label: automated_scanner
    confidence: 0.8
    risk_score: 35
    mitre_tags:
      - T1592
    evidence:
      - Sent a request to /wsman, the Windows remote management (WinRM) address. Its reply can give the Windows version, and it accepts logins for running commands remotely.
    conditions:
      - field: protocol
        operator: equals
        value: http
      - field: http_probe_targets
        operator: contains
        value: winrm
      - field: http_command_injection_attempt
        operator: equals
        value: false

  - id: http_windows_signin_probe
    name: Windows sign-in started without a password
    actor_label: automated_scanner
    confidence: 0.8
    risk_score: 35
    mitre_tags:
      - T1592
    evidence:
      - Started a Windows sign-in (NTLM or Negotiate) with no password. The server's reply names its Windows host and domain, which bots collect to choose targets.
    conditions:
      - field: protocol
        operator: equals
        value: http
      - field: http_auth_schemes
        operator: contains_any
        value:
          - ntlm
          - negotiate
