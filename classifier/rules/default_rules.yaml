rules_version: "1.0.0"
rules:
  - id: automated_discovery_burst
    name: Automated discovery burst
    actor_label: automated_scanner
    confidence: 0.72
    risk_score: 35
    mitre_tags:
      - T1087
      - T1082
    evidence:
      - High command rate with repeated discovery commands.
      - No clean exit command was observed.
    conditions:
      - field: commands_per_minute
        operator: gte
        value: 20
      - field: discovery_command_count
        operator: gte
        value: 3
      - field: exit_command_present
        operator: equals
        value: false

  - id: sensitive_file_probe
    name: Sensitive file probe
    actor_label: commodity_bot
    confidence: 0.78
    risk_score: 55
    mitre_tags:
      - T1005
      - T1552.001
    evidence:
      - Session attempted to read sensitive-looking fake files.
      - Decoy file exposure gives persona-specific context.
    conditions:
      - field: sensitive_file_read_count
        operator: gte
        value: 1
      - field: decoy_files_surfaced_count
        operator: gte
        value: 1

  - id: repeat_connections_same_ip
    name: Repeat connections from same source IP
    actor_label: brute_force_bot
    confidence: 0.75
    risk_score: 55
    mitre_tags:
      - T1110
    evidence:
      - Source IP reconnected at least 5 times in 24 hours, consistent with automated credential or access testing.
    conditions:
      - field: connection_count_from_same_ip
        operator: gte
        value: 5

  - id: authentication_attempt
    name: Authentication attempt observed
    actor_label: brute_force_bot
    confidence: 0.7
    risk_score: 55
    mitre_tags:
      - T1110
    evidence:
      - A complete credential submission (username and password) was observed during the active session.
    conditions:
      # >= 2 requires both a username and a password to have been submitted --
      # a bare, unfinished username line (auth_attempt_count == 1) isn't
      # evidence of a login attempt at all. Note this can't require *repeated*
      # attempts: FtpHandler and TelnetHandler each accept exactly one
      # USER/PASS exchange per connection by design (see their docstrings),
      # so a genuinely repeated pattern only shows up across sessions --
      # that's what repeat_connections_same_ip is for.
      - field: auth_attempt_count
        operator: gte
        value: 2

  - id: script_kiddie_tool_names
    name: Known tool name typed in the shell
    actor_label: script_kiddie
    confidence: 0.7
    risk_score: 40
    mitre_tags:
      - T1595
      - T1190
    evidence:
      - A known exploit or scanning tool name was typed directly in the session, consistent with running pre-packaged attack tooling rather than manual exploration.
    conditions:
      - field: protocol
        operator: equals
        value: tcp_shell
      - field: command_names
        operator: contains_any
        value:
          - sqlmap
          - nikto
          - hydra
          - nmap
          - masscan
          - metasploit
          - msfconsole
          - gobuster
          - dirb
          - dirsearch
          - wfuzz
          - burpsuite
          - john
          - hashcat

  - id: scripted_probe_with_clean_exit
    name: Scripted probe with clean exit
    actor_label: script_kiddie
    confidence: 0.6
    risk_score: 30
    mitre_tags:
      - T1082
      - T1087
    evidence:
      - Ran a short sequence of common discovery commands, then exited cleanly.
      - Repeated commands suggest a copy-pasted script rather than independent exploration.
    conditions:
      - field: protocol
        operator: equals
        value: tcp_shell
      - field: discovery_command_count
        operator: gte
        value: 2
      - field: repeated_command_count
        operator: gte
        value: 1
      - field: exit_command_present
        operator: equals
        value: true
      - field: command_count
        operator: lte
        value: 8

  - id: interactive_low_and_slow
    name: Interactive low and slow shell use
    actor_label: skilled_human_operator
    confidence: 0.64
    risk_score: 45
    mitre_tags:
      - T1059
    evidence:
      - Commands arrived at a slower interactive cadence.
      - Session used multiple unique commands.
    conditions:
      - field: average_inter_command_interval_seconds
        operator: gte
        value: 2
      - field: unique_command_count
        operator: gte
        value: 3
      - field: command_count
        operator: gte
        value: 4
